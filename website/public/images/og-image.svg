<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0a0b" />
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.06" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <pattern id="dotGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#27272a" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#dotGrid)" />
  <rect width="1200" height="630" fill="url(#glowCenter)" />

  <!-- Decorative hexagons -->
  <polygon points="100,160 140,140 180,160 180,200 140,220 100,200" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.15" />
  <polygon points="1060,400 1100,380 1140,400 1140,440 1100,460 1060,440" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.15" />
  <polygon points="200,480 230,465 260,480 260,510 230,525 200,510" fill="none" stroke="#10b981" stroke-width="1" opacity="0.1" />

  <!-- Connection lines decoration -->
  <line x1="140" y1="180" x2="600" y2="280" stroke="#3b82f6" stroke-width="0.5" opacity="0.12" />
  <line x1="1100" y1="420" x2="600" y2="280" stroke="#06b6d4" stroke-width="0.5" opacity="0.12" />
  <line x1="230" y1="495" x2="600" y2="280" stroke="#10b981" stroke-width="0.5" opacity="0.1" />

  <!-- Brand name -->
  <text x="600" y="260" text-anchor="middle" fill="#fafafa" font-size="96" font-weight="900" font-family="sans-serif" letter-spacing="4" filter="url(#bigGlow)">MAREF</text>

  <!-- Tagline -->
  <text x="600" y="310" text-anchor="middle" fill="#3b82f6" font-size="22" font-weight="600" font-family="sans-serif" letter-spacing="2">Agent Governance OS</text>

  <!-- Divider -->
  <line x1="400" y1="340" x2="800" y2="340" stroke="#27272a" stroke-width="1" />

  <!-- Value props -->
  <text x="600" y="375" text-anchor="middle" fill="#06b6d4" font-size="14" font-weight="600" font-family="sans-serif">TLA+ Model Checked</text>
  <circle cx="560" cy="370" r="2" fill="#71717a" />
  <circle cx="640" cy="370" r="2" fill="#71717a" />
  <text x="600" y="400" text-anchor="middle" fill="#10b981" font-size="14" font-weight="600" font-family="sans-serif">Zero Trust · Production Ready</text>

  <!-- Bottom -->
  <text x="600" y="560" text-anchor="middle" fill="#52525b" font-size="11" font-weight="500" font-family="sans-serif">Open Source · Apache 2.0 · github.com/maref-org/maref</text>

  <!-- Bottom line accent -->
  <line x1="360" y1="590" x2="840" y2="590" stroke="#3b82f6" stroke-width="2" opacity="0.3" />
</svg>