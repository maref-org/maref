<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>MAREF Pet - 悟空</title>
  <style>
    :root { --pet-size: 140px; }
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }

    html, body {
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: transparent !important;
      cursor: grab;
    }
    body.dragging { cursor: grabbing; }

    #pet-container {
      position: fixed;
      left: 60vw; top: 40vh;
      width: var(--pet-size); height: var(--pet-size);
      transition: none;
      z-index: 99999;
    }
    #pet-container.wandering {
      transition: left 2.5s ease-in-out, top 2.5s ease-in-out;
    }

    #pet-wukong {
      width: 100%; height: 100%;
      position: relative;
      transform-origin: bottom center;
    }
    #pet-wukong.facing-left .pet-img { transform: scaleX(-1); }

    @keyframes idle { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-4px) scale(1.04); } }
    @keyframes walk { 0% { transform: translateY(0) rotate(-3deg); } 25% { transform: translateY(-6px) rotate(0deg); } 50% { transform: translateY(0) rotate(3deg); } 75% { transform: translateY(-6px) rotate(0deg); } 100% { transform: translateY(0) rotate(-3deg); } }
    @keyframes jump { 0% { transform: translateY(0) scaleY(1); } 30% { transform: translateY(-50px) scaleY(1.15); } 50% { transform: translateY(-55px) scaleY(1.05); } 70% { transform: translateY(-20px) scaleY(0.9); } 85% { transform: translateY(5px) scaleY(1.1); } 100% { transform: translateY(0) scaleY(1); } }
    @keyframes shake { 0%,100% { transform: translateX(0); } 15% { transform: translateX(-10px) rotate(-6deg); } 30% { transform: translateX(10px) rotate(5deg); } 45% { transform: translateX(-8px); } 60% { transform: translateX(8px); } 75% { transform: translateX(-4px); } 90% { transform: translateX(4px); } }
    @keyframes sleep { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-3px) rotate(1deg); } }
    @keyframes drag-glow { from { filter: drop-shadow(0 0 6px rgba(255,215,0,0.5)); } to { filter: drop-shadow(0 0 16px rgba(255,215,0,0.9)); } }

    .pet-img {
      width: 100%; height: 100%;
      display: block;
      filter: drop-shadow(0 4px 14px rgba(0,0,0,0.2));
    }
    .state-idle .pet-img { animation: idle 2.2s ease-in-out infinite; }
    .state-walk .pet-img { animation: walk 0.55s linear infinite; }
    .state-jump .pet-img { animation: jump 0.7s ease-in-out forwards; }
    .state-error .pet-img { animation: shake 0.55s ease-in-out; }
    .state-sleep .pet-img { animation: sleep 3s ease-in-out infinite; }
    .state-drag .pet-img { animation: drag-glow 0.6s ease-in-out infinite alternate; transform: scale(1.1); }

    #pet-shadow {
      position: absolute;
      bottom: 2px; left: 15%; width: 70%; height: 10px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.18) 0%, transparent 70%);
      border-radius: 50%;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .state-jump #pet-shadow { transform: scale(0.4); opacity: 0.3; }
    .state-walk #pet-shadow { transform: scale(0.85); }

    #bubble {
      position: absolute;
      bottom: calc(var(--pet-size) + 6px); left: 50%;
      transform: translateX(-50%) scale(0);
      transform-origin: bottom center;
      background: rgba(255,253,240,0.97);
      border: 2px solid #D4A574;
      border-radius: 14px;
      padding: 8px 14px;
      min-width: 60px; max-width: 220px;
      font-size: 13px; color: #4A3520;
      font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
      box-shadow: 0 4px 18px rgba(139,69,19,0.15);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      pointer-events: none;
      white-space: nowrap;
      text-align: center;
    }
    #bubble::after {
      content: "";
      position: absolute;
      bottom: -8px; left: 50%;
      transform: translateX(-50%);
      border-width: 8px 6px 0;
      border-style: solid;
      border-color: #D4A574 transparent transparent;
    }
    #bubble.show { transform: translateX(-50%) scale(1); }

    #pet-wukong svg { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
<div id="pet-container">
  <div id="pet-wukong" class="state-idle">
    <svg class="pet-img" viewBox="0 0 160 170" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bodyGrad" cx="50%" cy="40%"><stop offset="0%" stop-color="#E8965A"/><stop offset="70%" stop-color="#C55A28"/><stop offset="100%" stop-color="#8B3A10"/></radialGradient>
        <radialGradient id="headGrad" cx="50%" cy="35%"><stop offset="0%" stop-color="#F0A86A"/><stop offset="100%" stop-color="#D2691E"/></radialGradient>
        <filter id="glow"><feGaussianBlur stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <ellipse cx="80" cy="158" rx="40" ry="8" fill="rgba(0,0,0,0.12)" id="pet-shadow"/>
      <g transform="translate(80,130)" class="anim-body">
        <ellipse cx="6" cy="22" rx="12" ry="8" fill="#C55A28" transform="rotate(30,6,22)"/>
        <ellipse cx="0" cy="0" rx="36" ry="42" fill="url(#bodyGrad)"/>
        <ellipse cx="0" cy="-2" rx="28" ry="32" fill="#DEB887" opacity="0.3"/>
        <path d="M-34,32 Q0,52 34,32 L30,14 L-30,14 Z" fill="#E8BD2B" stroke="#B8860B" stroke-width="1.5"/>
        <line x1="-24" y1="20" x2="24" y2="20" stroke="#C8960E" stroke-width="0.8"/>
        <ellipse cx="-18" cy="-2" rx="10" ry="15" fill="url(#bodyGrad)" transform="rotate(-25,-18,-2)"/>
        <ellipse cx="18" cy="-2" rx="10" ry="15" fill="url(#bodyGrad)" transform="rotate(25,18,-2)"/>
        <ellipse cx="0" cy="-44" rx="31" ry="29" fill="url(#headGrad)"/>
        <ellipse cx="0" cy="-60" rx="26" ry="13" fill="#704214" opacity="0.6"/>
        <ellipse cx="0" cy="-62" rx="30" ry="8" fill="none" stroke="#FFD700" stroke-width="2.5" filter="url(#glow)"/>
        <ellipse cx="-10" cy="-46" rx="5.5" ry="6.5" fill="#FFF"/>
        <circle cx="-10" cy="-46" r="2.8" fill="#FF4500"/>
        <circle cx="-10" cy="-46" r="1.3" fill="#1A1A1A"/>
        <ellipse cx="10" cy="-46" rx="5.5" ry="6.5" fill="#FFF"/>
        <circle cx="10" cy="-46" r="2.8" fill="#FF4500"/>
        <circle cx="10" cy="-46" r="1.3" fill="#1A1A1A"/>
        <path d="M-7,-34 Q0,-26 7,-34" fill="none" stroke="#5C3317" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="-18" cy="-42" r="4.5" fill="#FF6347" opacity="0.25"/>
        <circle cx="18" cy="-42" r="4.5" fill="#FF6347" opacity="0.25"/>
        <g filter="url(#glow)">
          <rect x="32" y="-80" width="4.5" height="85" fill="#B8860B" rx="2" transform="rotate(20,32,-80)"/>
          <rect x="29" y="-83" width="11" height="4.5" fill="#FFD700" rx="1.5" transform="rotate(20,32,-80)"/>
          <rect x="29" y="0" width="11" height="4.5" fill="#FFD700" rx="1.5" transform="rotate(20,32,-80)"/>
        </g>
      </g>
    </svg>
  </div>
  <div id="bubble"></div>
</div>

<script type="module">
const container = document.getElementById('pet-container');
const petEl = document.getElementById('pet-wukong');
const bubbleEl = document.getElementById('bubble');
const shadowEl = document.getElementById('pet-shadow');

const hasTauri = !!(window.__TAURI__?.invoke);
const tauriInvoke = hasTauri ? (cmd, args) => window.__TAURI__.invoke(cmd, args).catch(() => {}) : () => {};

let isDragging = false, dragOX = 0, dragOY = 0, facingLeft = false, curState = 'idle';
let wanderTimer = null, wanderRaf = null;
let petX = 0, petY = 0;

function initPosition() {
  const r = container.getBoundingClientRect();
  petX = r.left; petY = r.top;
}
initPosition();

function moveTo(x, y, animate) {
  petX = x; petY = y;
  if (hasTauri) {
    tauriInvoke('move_pet_window', { x: Math.round(x), y: Math.round(y) });
  } else {
    container.classList.toggle('wandering', !!animate);
    container.style.left = x + 'px';
    container.style.top = y + 'px';
  }
}

function setClass(c) {
  petEl.className = 'state-' + c;
  curState = c;
}

function face(l) {
  facingLeft = l;
  petEl.classList.toggle('facing-left', l);
}

function speak(text, dur) {
  dur = dur || 4000;
  bubbleEl.textContent = text;
  bubbleEl.classList.add('show');
  clearTimeout(bubbleEl._timeout);
  bubbleEl._timeout = setTimeout(() => bubbleEl.classList.remove('show'), dur);
}

// ── 拖拽 (browser: position:fixed; Tauri: OS窗口) ──
container.addEventListener('mousedown', (e) => {
  isDragging = true;
  document.body.classList.add('dragging');
  dragOX = e.clientX - petX;
  dragOY = e.clientY - petY;
  stopWander();
  setClass('drag');
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  moveTo(e.clientX - dragOX, e.clientY - dragOY, false);
});

document.addEventListener('mouseup', () => {
  if (!isDragging) return;
  isDragging = false;
  document.body.classList.remove('dragging');
  setClass('idle');
  setTimeout(startWander, 2000);
});

// ── 自动游走 ──
function stopWander() {
  if (wanderTimer) { clearTimeout(wanderTimer); wanderTimer = null; }
  if (wanderRaf) { cancelAnimationFrame(wanderRaf); wanderRaf = null; }
}

function startWander() {
  if (isDragging || curState === 'sleep') return;
  stopWander();

  const pad = 100, petSize = 140;
  const maxW = window.innerWidth || 1920;
  const maxH = window.innerHeight || 1080;

  function step() {
    if (isDragging) return;
    const tx = pad + Math.random() * (maxW - pad * 2);
    const ty = pad + Math.random() * (maxH - pad * 2 - 80);

    const duration = 2000 + Math.random() * 3000;
    if (tx < petX) face(true); else face(false);
    setClass('walk');

    const sx = petX, sy = petY;
    const start = performance.now();

    function anim(now) {
      if (isDragging) return;
      const p = Math.min((now - start) / duration, 1);
      const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      moveTo(sx + (tx - sx) * e, sy + (ty - sy) * e, false);
      if (p < 1) {
        wanderRaf = requestAnimationFrame(anim);
      } else {
        setClass('idle');
        wanderTimer = setTimeout(() => { setClass('walk'); step(); }, 1200 + Math.random() * 2500);
      }
    }
    wanderRaf = requestAnimationFrame(anim);
  }
  step();
}

// ── 触摸拖拽 ──
container.addEventListener('touchstart', (e) => {
  isDragging = true;
  const t = e.touches[0];
  dragOX = t.clientX - petX;
  dragOY = t.clientY - petY;
  stopWander();
  setClass('drag');
}, { passive: false });

document.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  const t = e.touches[0];
  moveTo(t.clientX - dragOX, t.clientY - dragOY, false);
});

document.addEventListener('touchend', () => {
  if (!isDragging) return;
  isDragging = false;
  setClass('idle');
  setTimeout(startWander, 2000);
});

// ── 全局 API ──
window.__PET_SPEAK__ = speak;
window.__PET_JUMP__ = () => { setClass('jump'); speak('功德圆满！', 3000); setTimeout(() => setClass('idle'), 1000); };
window.__PET_ERROR__ = (msg) => { setClass('error'); speak(msg || '不妙！有 Bug 精！', 4000); setTimeout(() => setClass('idle'), 1000); };
window.__PET_THINK__ = () => { setClass('idle'); speak('待俺掐指一算…', 3000); };
window.__PET_SLEEP__ = () => { stopWander(); setClass('sleep'); };
window.__PET_WAKE__ = () => { setClass('idle'); setTimeout(startWander, 1000); };
window.__PET_HIDE__ = () => { stopWander(); container.style.display = 'none'; };
window.__PET_SHOW__ = () => { container.style.display = ''; setTimeout(startWander, 1000); };

// ── 事件监听 ──
window.addEventListener('pet-state-change', (e) => {
  const d = (e.detail || e).detail || e;
  const type = d.type || d;
  if (type === 'error' || type === 'agent.error') window.__PET_ERROR__();
  if (type === 'success' || type === 'agent.success') window.__PET_JUMP__();
  if (type === 'thinking' || type === 'agent.thinking') window.__PET_THINK__();
  if (type === 'idle' || type === 'agent.idle') { if (d.minutes > 30 || d.payload?.minutes > 30) window.__PET_SLEEP__(); }
});

// ── 启动 ──
setTimeout(startWander, 2500);
console.log('🐵 悟空驾到！拖拽我到处跑吧~');
</script>
</body>
</html>
