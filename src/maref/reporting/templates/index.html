<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAREF Governance Reports Index</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #1a1a2e; background: #f8f9fa; }
  h1 { color: #16213e; border-bottom: 3px solid #0f3460; padding-bottom: 8px; }
  .subtitle { color: #555; margin-bottom: 24px; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #ddd; }
  th { background: #0f3460; color: white; }
  tr:hover td { background: #e8f4f8; }
  a { color: #0f3460; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .fp { font-family: 'SF Mono', Monaco, monospace; font-size: 0.85em; color: #555; }
  .empty { color: #888; font-style: italic; text-align: center; padding: 40px; }
  .verify-link { display: inline-block; margin-top: 16px; }
  .verify-link a { color: #2e7d32; font-weight: 600; }
</style>
</head>
<body>
<h1>MAREF Governance Reports</h1>
<div class="subtitle">Public audit reports — verified via <span class="fp">${fingerprint}</span></div>

${report_table}

<p class="verify-link">Verify: <a href="fingerprint.txt">fingerprint.txt</a></p>
</body>
</html>
