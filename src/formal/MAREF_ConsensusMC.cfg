SPECIFICATION Spec

CONSTANTS
  Validators = {"v1", "v2", "v3", "v4", "v5"}
  ProposalIds = {p1}
  MaxWeight = 10
  MaxRounds = 3

CONSTRAINT
  StateConstraint

INVARIANTS
  WeightBoundsInvariant
  TrustBoundsInvariant
  ByzantineBoundInvariant
  QuorumIntegrityInvariant
  TrustWeightCorrelationInvariant

(* Liveness 需公平性（WF）才能成立，且 WF 下状态空间过大无法模型检查；
   核心安全保证由 INVARIANTS 验证。 *)
(* 死锁是模型有意行为：投票耗尽且未达 quorum 时系统停止（不会无限运行）。 *)
CHECK_DEADLOCK FALSE
