(*
  TLC Model Checker Configuration for MarefLiteModel

  This file configures the TLC model checker to verify:
  - Type invariants
  - Safety properties (no deadlocks, entropy bounds)
  - Liveness properties (termination, governance effectiveness)
*)

SPECIFICATION Spec

CONSTANTS
  Agents = {"agent1", "agent2"}
  MaxTransitions = 5

INVARIANTS
  TypeInvariant
  ValidStateInvariant
  TerminalAbsorbing
  EntropyBound

PROPERTIES
  Termination
  GovernanceEffectiveness

CHECK_DEADLOCK
  TRUE
