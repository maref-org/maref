(*
  TLC Model Checker Configuration for MarefAgent24

  Verifies:
  - NoDeadlock: every non-terminal state has outgoing transitions
  - NoOrphan: every state except UNINITIALIZED has incoming transitions
  - TerminatedFinal: TERMINATED has no outgoing transitions
  - ZombieFinal: ZOMBIE has no outgoing transitions
  - GrayContinuity: every valid transition changes exactly 1 Gray code bit
  - StateCount: exactly 24 states
  - UninitToTerminated: path exists from UNINITIALIZED to TERMINATED
*)

SPECIFICATION Spec

CONSTANTS
  Agents = {"agent1", "agent2"}
  MaxTransitions = 5

INVARIANCES
  NoDeadlock5
  NoOrphan5
  TerminatedFinal5
  ZombieFinal5
  GrayContinuity5
  StateCount5
  UninitToTerminated

CHECK_DEADLOCK
  TRUE
