\* TLC config for MarefAgent24Model (24-state / 5-bit Gray-coded lifecycle FSM).
\*
\* 2026-11-22 修复：
\*   - 关键字由 `INVARIANCES`（非法）改为 `INVARIANTS`；
\*   - 不再给 AgentStates 赋区间值（cfg 语法不支持），改为模块内定义；
\*   - UninitToTerminated 用 Seq(AgentStates) 量化，TLC 无法枚举无限序列集，
\*     该性质由 scripts/…… 的 Python validator（BFS 可达性）覆盖。
SPECIFICATION Spec

CONSTANTS
  Agents = {"agent1"}

INVARIANTS
  NoDeadlock5
  NoOrphan5
  TerminatedFinal5
  ZombieFinal5
  GrayContinuity5
  StateCount5

CHECK_DEADLOCK
  TRUE
