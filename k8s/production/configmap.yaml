apiVersion: v1
kind: ConfigMap
metadata:
  name: maref-config
  namespace: maref
data:
  MAREF_HOME_DIR: "/data/maref"
  MAREF_CB_MAX_DEPTH: "3"
  MAREF_CB_COOLDOWN: "30.0"
  MAREF_DUAL_PRIMARY: "4.0"
  MAREF_FNR_TARGET: "0.15"
  MAREF_A2A_URL: "http://localhost:8000"
  MAREF_A2A_VERSION: "1.0"
  APP_VERSION: "0.34.0-rc"
  MCP_GATEWAY_ENABLED: "true"
  A2A_DISCOVERY_ENABLED: "true"
