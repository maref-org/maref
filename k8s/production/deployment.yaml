apiVersion: apps/v1
kind: Deployment
metadata:
  name: maref-governance
  namespace: maref
  labels:
    app: maref-governance
    component: governance
    version: v0.34.0-rc
spec:
  replicas: 3
  selector:
    matchLabels:
      app: maref-governance
      component: governance
  template:
    metadata:
      labels:
        app: maref-governance
        component: governance
version: v0.34.0-rc
    spec:
      containers:
        - name: governance
          image: maref/governance:v0.34.0-rc
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "2000m"
          env:
            - name: MAREF_SAFETY_LEVEL
              value: "production"
            - name: MAREF_DRY_RUN
              value: "false"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4318"
          envFrom:
            - configMapRef:
                name: maref-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
        - name: sidecar
          image: maref/sidecar:v0.34.0-rc
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          env:
            - name: MAREF_SAFETY_LEVEL
              value: "production"
          envFrom:
            - configMapRef:
                name: maref-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1002
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
              name: sidecar
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: maref-governance
  namespace: maref
  labels:
    app: maref-governance
    component: governance
spec:
  selector:
    app: maref-governance
    component: governance
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: sidecar
      port: 8000
      targetPort: 8000
  type: ClusterIP
