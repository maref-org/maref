apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: maref-governance-netpol
  namespace: maref
spec:
  podSelector:
    matchLabels:
      app: maref-governance
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: maref-sidecar
      ports:
        - port: 8000
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 9090
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: maref-sidecar
      ports:
        - port: 8000
          protocol: TCP
