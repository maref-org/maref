apiVersion: v1
kind: ServiceAccount
metadata:
  name: maref-desktop-agent
  namespace: maref
  labels:
    app: maref
    component: desktop-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maref-desktop-agent
  namespace: maref
  labels:
    app: maref
    component: desktop-agent
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maref-desktop-agent
  namespace: maref
  labels:
    app: maref
    component: desktop-agent
subjects:
  - kind: ServiceAccount
    name: maref-desktop-agent
    namespace: maref
roleRef:
  kind: Role
  name: maref-desktop-agent
  apiGroup: rbac.authorization.k8s.io
