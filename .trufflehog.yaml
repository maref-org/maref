# .trufflehog.yaml — TruffleHog 密钥扫描配置
detectors:
  - name: aws
    enabled: true
  - name: gcp
    enabled: true
  - name: github
    enabled: true
  - name: slack
    enabled: true
  - name: generic
    enabled: true
    entropy:
      min: 4.5
      max: 8.0
    pattern:
      - "(?i)(?:api[_-]?key|apikey|secret[_-]?key|secretkey|token|password)(?:\\s*[:=]\\s*)(['\"]?)([a-zA-Z0-9_\\-]{16,})\\1"

exclude:
  - paths:
      - "*.md"
      - "*.yaml"
      - "*.yml"
      - "*.json"
      - "*.txt"
      - "CHANGELOG*"
      - "**/test*/**"
      - "**/tests/**"
      - "node_modules/**"
      - ".venv*/**"
      - "__pycache__/**"
      - ".git/**"
      - "*.lock"
      - ".missions/**"
