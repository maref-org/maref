design_principles:
  - Substring matching for robust target detection (works with compound names)
  - Temporary override supported via context manager for debugging/emergency
  - Full audit trail of all freeze checks for compliance
  - Pareto comparison utility included for evolutionary correctness
  - Constitutional self-frozen: the freeze zone definition cannot freeze itself
  - Backward compatible: existing EvolutionDSL usage still works
  - Test-first: 38 unit tests with 100% coverage on new code

open_questions_closed:
