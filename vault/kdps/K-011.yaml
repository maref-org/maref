architecture_changes:
  - file: src/maref/recursive/rule_freeze_zone.py
    change: >
      New file created: implements RuleFreezeZone, FreezeBlockedError,
      FreezeZoneCheckResult, ParetoComparison, compare_pareto, is_frozen.
      227 lines of clean dataclass-based design.
  - file: src/maref/recursive/evolution_dsl.py
    change: >
      EvolutionDSL.__init__ now initializes default RuleFreezeZone;
      propose() now performs freeze check before allowing proposal;
      load_default_rules() now skips frozen targets by default (skip_frozen=True);
      added freeze_zone property for access.
  - file: src/maref/recursive/__init__.py
    change: Added RuleFreezeZone and related symbols to public exports.
  - file: tests/unit/test_rule_freeze_zone.py
    change: New file with 38 unit tests covering all functionality.
  - file: tests/evolution/test_c3_convergence.py
    change: Fixed two failing tests to account for freezing behavior.

