## 5. 集成关系

### 5.1 与现有模块集成
- **EvolutionDSL**: LifeCycleManager 可触发进化规则
- **RuleFreezeZone**: 生命周期状态变更受冻结区保护
- **DecisionMarket**: Federation 使用共识机制做任务分配决策
- **CircuitBreaker**: HealthMonitor 集成熔断器模式

### 5.2 内部模块依赖图
```
metadata (C31)
  ↓
registry (C32) ←→ state_machine (C33)
  ↓
messaging (C34) ←→ sandbox (C37)
  ↓
health (C35) ←→ resources (C36)
  ↓
lifecycle (C38) — 整合 C31-C37
  ↓
federation (C39) — 基于 lifecycle + registry
```

## 6. 安全考量
- 沙箱权限矩阵防止越权访问
- 健康监控自动隔离异常实体
- 审计日志记录所有生命周期事件
- 资源配额防止资源耗尽攻击

