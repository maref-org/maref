## 1. 设计目标
实现 MAREF 的"生命态"（Living State）概念，使系统组件具备：
- 自我感知 (Self-awareness)
- 自适应 (Self-adaptation)
- 自修复 (Self-healing)
- 自协作 (Self-collaboration)

## 2. 核心组件

### 2.1 C31: 生命态定义与元数据模型 (metadata.py)
- **LifeStateType**: 5 种类型 (AGENT, SERVICE, PIPELINE, KNOWLEDGE, GOVERNANCE)
- **LifeStateCapability**: 9 种能力 (COMPUTE, REASON, LEARN, COMMUNICATE, HEAL, REPRODUCE, OBSERVE, GOVERN, EVOLVE)
- **LifeStateMetadata**: 元数据包含 id, type, version, capabilities, health_score, birth_time, lineage, labels

### 2.2 C32: 生命态注册与发现机制 (registry.py)
- **LifeStateRegistry**: 注册/注销/查询
- 支持按类型、能力、标签、健康状态查询
- 支持订阅变更事件

### 2.3 C33: 生命态状态机与转换 (state_machine.py)
- **LifeStateMachine**: 5 状态转换图
  - BIRTH → ACTIVE → DEGRADED → RECOVERING → TERMINATED
- 转换条件可配置，非法转换被阻止
- 支持 entry/exit 回调和订阅

### 2.4 C34: 生命态间通信协议 (messaging.py)
- **LifeStateMessage**: 消息类型 (HEARTBEAT, REQUEST, RESPONSE, EVENT, ALERT)
- **MessageBus**: 支持 1:1 和 1:N 消息
- 消息优先级和超时机制

### 2.5 C35: 生命态健康监控与自愈 (health.py)
- **HealthMonitor**: 健康评分算法 (0-100)
- **SelfHealer**: 自愈策略 (RESTART, DEGRADE, ISOLATE, NOTIFY)
- 异常检测阈值可配置

### 2.6 C36: 生命态资源管理 (resources.py)
- **ResourceMonitor**: CPU/内存/IO/网络监控
- **ResourceQuota**: 配额限制和告警
- 资源竞争仲裁

### 2.7 C37: 生命态安全沙箱 (sandbox.py)
- **LifeStateSandbox**: 权限矩阵 (READ, WRITE, EXECUTE, NETWORK, FILESYSTEM, SYSTEM)
- 行为监控和审计日志
- 访问控制强制

### 2.8 C38: 生命态生命周期管理 (lifecycle.py)
- **LifeCycleManager**: 完整生命周期编排
- 生命周期钩子 (on_birth, on_activate, on_degrade, on_recover, on_terminate)
- 集成 HealthMonitor + SelfHealer + Registry + StateMachine

### 2.9 C39: 生命态联邦协作 (federation.py)
- **LifeStateFederation**: 联邦注册和协商
- 任务分配和负载均衡 (基于能力匹配)
- 角色系统 (COORDINATOR, WORKER, OBSERVER)

### 2.10 C40: 集成测试与归档
- 10 个端到端集成测试
- 全链路场景验证

