kdp_id: K-20260518-001
topic: MAREF Memory Crash Root Cause Fix — Four Architecture Defects
signal_ids:
- S-20260511-001
claim: >
  MAREF's memory crash (24GB OOM during Trae CN optimization) was caused by four
  superimposed architecture defects, not by Trae CN or resource constraints:
  (1) entropy threshold >= 4.0 caused boundary-triggered anomaly spam (404,941 writes),
  (2) CircuitBreaker depth reset every observation cycle prevented breaker trips,
  (3) 1s polling without backoff saturated CPU under load,
  (4) force_stabilize did not reduce observed entropy, creating an infinite anomaly loop.
  All four were fixed in a single remediation pass with 0 regressions across 313 tests.
metric_type: count
value: '4'
source_citation: maref_memory_crash_analysis
confidence: 95
verification_status: verified_by_test
verification_method: targeted_test_suite
consensus_score: 1.0
fix_summary:
  p0_fixes:
    - id: Fix 1a
      file: src/sidecar/monitor.py
      change: "EntropyMonitor threshold >= to > (line 66)"
      rationale: "entropy=4.0 is a stable boundary, not an anomaly"
    - id: Fix 1b
      file: src/sidecar/collector.py
      change: "MockAgentAdapter entropy boundaries > to >= (lines 80-83)"
      rationale: "Align with integer entropy levels from state machine"
    - id: Fix 2
      file: src/maref_lite/recursive_governance.py
      change: >
        CircuitBreaker: time-window depth reset (60s) instead of unconditional,
        consecutive anomaly trip (5 consecutive critical anomalies)
      rationale: "Depth was reset to 0 on every cycle, breaker never tripped"
    - id: Fix 4
      file: src/maref_lite/governance.py
      change: "_handle_anomaly now calls collector.notify_anomaly() for backoff signal"
      rationale: "force_stabilize transitions to STABILIZE (entropy=0); Fix 1a+2 break the loop"
  p1_fixes:
    - id: Fix 3a
      file: src/sidecar/collector.py
      change: "Adaptive backoff: 1s -> exponential -> max 30s, reset on anomaly detect"
      rationale: "Full-load CPU saturation with constant 1s polling"
    - id: Fix 3b
      file: src/maref_lite/recursive_governance.py
      change: "Self-observation interval already at 5s via config (no code change needed)"
      rationale: "self_observation_cooldown=5.0 in RecursiveGovernanceConfig"
  p2_fixes:
    - id: Fix 5a
      file: src/maref/governance/audit.py
      change: "Log rotation at 50MB; _rotate() renames current file with timestamp"
      rationale: "199MB audit log accumulated during crash"
    - id: Fix 5b
      file: src/maref/governance/audit.py
      change: "logging.warning when read_all called without max_entries limit"
      rationale: "Prevent OOM from unbounded log reads"
    - id: Fix 5c
      file: src/maref_lite/governance.py
      change: "ObservationStore default path from :memory: to governance_observations.db"
      rationale: "File-backed storage prevents memory accumulation"
halt_invariant: >
  Any anomaly triggers either backoff escalation or circuit breaker trip.
  Both exit channels guarantee the infinite loop terminates in finite steps:
  - Anomaly detected -> adaptive backoff (1s -> 2s -> 4s -> ... -> 30s max)
  - 5 consecutive critical anomalies -> circuit breaker trip -> force_stabilize
