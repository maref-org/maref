raw_text: 'MAREF open-source business model: AGPL-3.0 licensed core governance engine
  (free, copyleft). Sidecar adapter pattern allows MAREF to plug into LangGraph/CrewAI/AutoGen
  without modifying them, creating an ecosystem moat. Potential revenue: enterprise
  governance contracts (SLA, certification, TLA+ security audits), managed MAREF cloud
  (governance-as-a-service), agent safety certification program. Comparable to: HashiCorp''s
  open-core model (Terraform free, Terraform Cloud paid).'
