raw_text: 'Eleven major multi-agent frameworks compared in MAS-TS-001 standard: MAREF,
  LangGraph, CrewAI, AutoGen, MetaGPT, UFO (Microsoft), DSPy, SGLang, Semantic Kernel,
  Dify, Coze. MAREF is the only one with three unique capabilities: (1) TLA+ formal
  verification, (2) Gray Code state machine governance, (3) Sidecar non-invasive governance
  pattern. All others are either orchestrators (LangGraph, AutoGen) or role-players
  (CrewAI, MetaGPT) without formal safety guarantees.'
