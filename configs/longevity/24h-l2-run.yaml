# 24-hour unsupervised RSI run — L2 mode
# Usage: python scripts/run_longevity.py --config configs/longevity/24h-l2-run.yaml

run:
  duration_hours: 24
  check_interval_minutes: 30
  mode: l2
  mock: true                    # Use mock mode to control LLM API costs
  l2_dimensions: [correctness, testing, code_quality, security, performance]
  
thresholds:
  max_adoption_rate_decline: 0.1
  max_score_decline: 5.0
  max_safety_alerts: 1
  max_human_intervention_pct: 2.0

reporting:
  slack_webhook: ""             # Optional: set SLACK_WEBHOOK env var
  report_path: docs/rsi/24h-l2-run-report
  auto_archive: true

quality_gates:
  c1_min_score: 60.0
  c2_min_score: 65.0
  c3_min_score: 70.0
  c4_min_score: 75.0
  l2_dim_count: 5
  l2_min_dim_score: 70.0
  l2_cross_impact_threshold: -0.3
