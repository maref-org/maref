(*
  TLC Model Checking Configuration for MAREF_Consensus.tla
  
  Run with:
    java -cp tla2tools.jar tlc2.TLC -config MAREF_ConsensusMC.cfg MAREF_Consensus
*)

CONSTANTS
  Validators = {"v1", "v2", "v3"}
  MaxWeight = 5
  MaxRounds = 5
  QuorumThreshold = 67
  ProposalIDs = {1, 2}

INIT
  Init

NEXT
  Next

CONSTRAINT
  StateConstraint

INVARIANTS
  WeightBoundsInvariant
  TrustBoundsInvariant
  ByzantineBoundInvariant
  QuorumIntegrityInvariant
  TrustWeightCorrelationInvariant

CHECK_DEADLOCK TRUE