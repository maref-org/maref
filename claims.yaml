# 公开声称账本（claim ledger）
#
# 规则：
# 1. 凡声称**本仓可度量的属性**（版本 / 入口 / 规模 / 覆盖率 / 依赖 / 测试 / 形式化 /
#    控制项数），必须在这里登记，并有一条可在本地复算的命令；引用第三方调研的数字
#    （Gartner / Gravitee 等）必须带来源链接，不纳入本账本。
#    —— 2026-11-22 明确边界：旧规则写"任何数字"，实际只覆盖 13 条，规则比实现对不上，
#    导致 README 的"5 invariants / 4 TLA+ / 10 OWASP"长期无人拦（复盘 P2）。
# 2. 改数字 = 改这里 + 跑 `python3 scripts/claims.py --check`，CI 会阻断漂移。
# 3. 命令不联网、不写仓库、输出单行；python/python3 会被替换为当前解释器。
# 4. `same_as` 用于跨文件一致性（版本三角），`min` 用于下限声称，`equals` 用于精确断言。
#
# 本文件与 scripts/claims.py 自 2026-11-21（v0.55.3）起同时存在于公开仓，
# 因为对外可见的仓库才是评估者的取证对象，而在此之前账本只存在于开发仓。

spec_version: 1
timeout_seconds: 180

claims:
  - id: version.api
    statement: Python 包版本（maref.__version__）
    command:
      - python3
      - -c
      - "import sys;sys.path.insert(0,'src');import maref;print(maref.__version__)"
    expect:
      same_as: version.pyproject

  - id: version.pyproject
    statement: pyproject.toml 中的项目版本
    command:
      - python3
      - -c
      - "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
    expect:
      same_as: version.api

  - id: version.readme_badge
    statement: README 徽章展示的版本
    command: [python3, scripts/claims_probe.py, readme_badge]
    expect:
      same_as: version.api

  - id: version.citation
    statement: CITATION.cff 声明的版本（学术引用面）
    command: [python3, scripts/claims_probe.py, citation_version]
    expect:
      same_as: version.api

  - id: tests.functions
    statement: tests/ 下 test_* 函数数量（下限口径，非 pytest collect 数）
    command: [python3, scripts/claims_probe.py, count_tests]
    expect:
      min: 16000

  - id: coverage.gate
    statement: pytest-cov 强制覆盖率门槛（公开仓 50；开发仓旧值 15）
    command: [python3, scripts/claims_probe.py, coverage_gate]
    expect:
      equals: "50"

  - id: tests.readme_floor
    statement: README 对外测试数量下限（必须等于 claims 里的地板，禁止写成某个旧 commit 的精确数）
    command: [python3, scripts/claims_probe.py, readme_tests_floor]
    expect:
      equals: "16000"

  - id: coverage.state
    statement: STATE.yaml 记录的最近一次实测综合覆盖率
    command: [python3, scripts/claims_probe.py, coverage_state]
    expect:
      equals: "76.50"

  - id: coverage.readme_badge
    statement: README 覆盖率徽章（必须等于 STATE.yaml 实测值；拒绝无来源聚合数）
    command: [python3, scripts/claims_probe.py, coverage_readme_badge]
    expect:
      same_as: coverage.state

  - id: deps.direct
    statement: pyproject.toml 直接运行时依赖数量（含 gmssl / cryptography）
    command: [python3, scripts/claims_probe.py, count_deps]
    expect:
      equals: "11"

  - id: sdk.package_name
    statement: TypeScript SDK 的真实 npm 包名（README 必须与之一致）
    command:
      - python3
      - -c
      - "import json;print(json.load(open('sdk/typescript/package.json'))['name'])"
    expect:
      equals: "@maref-org/sdk"

  - id: audit.tamper_detect
    statement: 审计链能检出被篡改的记录
    command: [python3, scripts/claims_probe.py, audit_tamper]
    expect:
      equals: detected
    timeout: 60

  - id: audit.key_rotation
    statement: 换钥/错钥只标 unverifiable，不误判为篡改
    command: [python3, scripts/claims_probe.py, audit_rotation]
    expect:
      equals: unverifiable
    timeout: 60

  - id: formal.tlc_jobs
    statement: CI 每次构建真正执行 TLC 的任务数（formal-verify.yml 里的 tlc2.TLC 调用）
    command: [python3, scripts/claims_probe.py, formal_tlc_jobs]
    expect:
      equals: "4"

  - id: formal.specs
    statement: src/formal/ 下的 .tla 规格总数（不等于"被检查的规格数"）
    command: [python3, scripts/claims_probe.py, formal_specs]
    expect:
      equals: "18"

  - id: formal.cfg
    statement: src/formal/ 下的 TLC 配置文件数
    command: [python3, scripts/claims_probe.py, formal_cfg]
    expect:
      equals: "10"

  - id: conformance.controls
    statement: AG-Conformance 套件的控制项条数（README "10 controls" 的来源）
    command: [python3, scripts/claims_probe.py, conformance_controls]
    expect:
      equals: "10"

  - id: owasp.risks_documented
    statement: OWASP Agentic Top 10 映射文档里逐条展开的风险数
    command: [python3, scripts/claims_probe.py, owasp_risks]
    expect:
      equals: "10"

  - id: owasp.tla_specs
    statement: 有 TLA+ 规格支撑的 OWASP 风险数（README 与 mapping 文档必须一致）
    command: [python3, scripts/claims_probe.py, owasp_tla_specs]
    expect:
      equals: "4"
