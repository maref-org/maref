name: Repair gh-pages (one-off)

# 一次性修复：2026-11-11 报告链断裂（浅克隆 fetch 被判 non-fast-forward，历史
# 恢复被静默跳过）。移除两份孤立归档，并把 latest.json 回滚到最后一份链连续的
# 报告 c891ac33，让下一次部署从正确的前驱续链。
# 仅 workflow_dispatch；修复完成后由后续 PR 删除本文件。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install package (for report export)
        run: python3 -m pip install -q ".[identity]"

      - name: Switch to gh-pages
        run: git checkout gh-pages

      - name: Remove off-chain reports and roll latest back
        run: |
          set -euo pipefail
          git rm verify/694933a5.html verify/1c18dbe3.html \
                 verify/report-20261110T041325Z.json \
                 verify/report-20261111T053007Z.json
          cp verify/report-20261110T000057Z.json verify/latest.json

      - name: Regenerate latest.html and index
        run: |
          python3 - <<'PY'
          from pathlib import Path

          from maref.reporting.exporter import ReportExporter
          from maref.reporting.models import GovernanceReport

          out_dir = Path("verify")
          reports = {}
          for f in sorted(out_dir.glob("*.json")):
              try:
                  report = GovernanceReport.from_json(f.read_text("utf-8"))
              except Exception:
                  continue
              reports[report.report_id] = report

          exporter = ReportExporter()
          for report in reports.values():
              exporter.export_report(report, out_dir / f"{report.report_id[:8]}.html")

          newest = max(reports.values(), key=lambda r: r.created_at, default=None)
          if newest is not None:
              exporter.export_report(newest, out_dir / "latest.html")

          exporter.export_index(
              out_dir,
              out_dir / "index.html",
              signer_fingerprint=newest.signer_fingerprint if newest else "",
          )
          print("restored latest:", newest.report_id[:8] if newest else None,
                "reports:", len(reports))
          PY

      - name: Commit and push
        run: |
          set -euo pipefail
          git add -A
          git -c user.name="maref-ci" -c user.email="ci@maref.cc" \
              commit -m "repair: drop off-chain reports, restore latest chain to c891ac33"
          git push origin gh-pages
