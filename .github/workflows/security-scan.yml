name: Security Scan

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  bandit:
    name: Bandit Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit
        run: |
          bandit -r src/ --exit-zero --format json --output bandit-report.json
          HIGH=$(python3 -c "
          import json
          with open('bandit-report.json') as f:
              r = json.load(f)
          high = [x for x in r.get('results', []) if x.get('issue_severity') in ('HIGH', 'CRITICAL')]
          print(len(high))
          ")
          echo "High/Critical severity issues: $HIGH"
          [ "$HIGH" -eq "0" ] || exit 1
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  safety:
    name: Safety Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt
      - name: Install safety
        run: pip install safety
      - name: Run safety check
        run: safety check --full-report
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: .safety-known-vulns.json
          retention-days: 30

  pip-audit:
    name: pip-audit Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: pip-audit --format json --output pip-audit-report.json || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

  trivy:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect hardcoded secrets
        run: |
          # Scan for common API key patterns
          echo "Scanning for hardcoded API keys..."
          grep -r "sk-[a-f0-9]\{32\}" --include="*.py" --include="*.sh" --include="*.plist" --include="*.yaml" --include="*.yml" --include="*.json" --include="*.toml" src/ scripts/ configs/ 2>/dev/null && exit 1 || true

          # Scan for common secret patterns
          echo "Scanning for hardcoded secrets..."
          grep -rE "(password|secret|api_key|token)\s*[:=]\s*['\"][a-zA-Z0-9]{16,}['\"]" --include="*.py" --include="*.sh" --include="*.yaml" --include="*.yml" --include="*.json" --include="*.toml" src/ scripts/ configs/ 2>/dev/null && exit 1 || true

          echo "✓ No hardcoded secrets detected"

  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt
      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py -e -o sbom.json --output-format JSON || echo "SBOM generation skipped"
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  zap-dast:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[sidecar]"
      - name: Start sidecar server
        run: |
          python -m src.sidecar.server &
          sleep 3
          curl -f http://localhost:8000/health || echo "Server not ready"
      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'http://localhost:8000'
          cmd_options: '-a'
          allow_issue_writing: false
      - name: Stop server
        if: always()
        run: kill %1 || true
