name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"  # 每天 UTC 3:00

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog Secret Scan
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@v3.90.8
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified --exclude-paths .trufflehogignore
      - name: TruffleHog filesystem scan
        if: github.event_name != 'pull_request'
        run: |
          pip install trufflehog
          trufflehog filesystem . --only-verified --no-update || true

  semgrep-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/cwe-top-25
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Upgrade pip first
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: pip install -e ".[dev,sidecar,otel,a2a,orchestration,identity]"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Upgrade setuptools (PYSEC-2026-3447)
        run: python -m pip install -U "setuptools>=83.0.0"
      - name: pip-audit
        run: pip-audit --ignore-vuln PYSEC-2026-196

  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          skip-dirs: gui/src-tauri/target,website/node_modules,.git,.worktrees
          # trivy 对 pnpm-lock.yaml 的 scoped 包名解析有误报：
          # @tailwindcss/vite@4.3.1 / @poppinss/colors@4.1.6 被误读为 vite@4.3.1 / colors@4.1.6，
          # 命中已由真实依赖（vite@7.3.6）修复的旧 CVE（CVE-2021-23567 / CVE-2023-34092 /
          # CVE-2024-23331 / CVE-2024-52011 / CVE-2026-53571）。
          # 排除误报源；website 前端依赖漏洞由 dependabot（website npm 条目）覆盖。
          skip-files: website/pnpm-lock.yaml

  dast-scan:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # `maref serve` 需要 HMAC/Ed25519 密钥才能启动 AuditLogger，
      # 且 MCPGateway 需要 MAREF_MCP_SECRET_KEY 才能启动 MCP 服务；
      # 沿用 docker.yml 惯例：未配置 secrets 时 fallback 到 CI 测试 key。
      MAREF_HMAC_SECRET_KEY: ${{ secrets.MAREF_HMAC_SECRET_KEY || 'ci-hmac-key' }}
      MAREF_MCP_SECRET_KEY: ${{ secrets.MAREF_MCP_SECRET_KEY || 'ci-mcp-key' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies and start server
        run: |
          pip install -e ".[dev,sidecar,otel,a2a,orchestration,identity]"
          maref serve --host 0.0.0.0 --port 8080 &
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/api/health; then
              echo "Server ready"
              break
            fi
            echo "Waiting for server... ($i/10)"
            sleep 3
          done
          curl -sf http://localhost:8080/api/health || exit 1
      - name: OWASP ZAP Baseline Scan
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:8080"
          cmd_options: "-a -j"
      - name: Upload ZAP reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-reports
          path: |
            zap-report.*
            zap.out
