name: Dependabot Auto-Merge

# 自动合并已暂停：GITHUB_TOKEN 触发的 squash 合并不会触发 push CI，
# 导致 main 缺少 6 项必需 check-runs，D1 Pre-Flight 必然失败。
# 恢复条件：配置 GitHub App 或 PAT（MAREF_AUTOMERGE_TOKEN），
# 使合并由非 GITHUB_TOKEN 身份发起；在此之前仅提示人工合并。
# 本 job 不 checkout/执行 PR 代码，仅读取 PR 元数据。
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # 以 PR 作者判定而非事件 actor：维护者对 Dependabot 分支 rebase 后
    # 触发的 synchronize 事件 actor 是维护者，但内容仍完全来自 Dependabot。
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      # 历史背景：原 action 依赖评论合并会被 cla-assistant 永久 pending 阻塞，
      # 故改用 GitHub 原生 auto-merge。现因 GITHUB_TOKEN 合并不触发 push CI
      # 而暂停，待配置 App/PAT 后恢复。
      - name: Report dependabot PR (auto-merge paused)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 不 checkout 仓库，gh 需显式知道目标仓库。
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # update-type 元数据在 Dependabot 提交信息的 trailer 里，不在 PR body。
          commits=$(gh pr view "$PR" --json commits \
              --jq '[.commits[].messageBody // ""] | join("\n")') || {
            echo "::error::failed to read PR commits; refusing to classify"
            exit 1
          }
          if grep -q 'version-update:semver-major' <<<"$commits"; then
            echo "::notice::major update; manual review required"
            exit 0
          fi
          echo "::warning::Dependabot auto-merge paused; PR #$PR requires manual merge until MAREF_AUTOMERGE_TOKEN is configured"
