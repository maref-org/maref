name: Dependabot Auto-Merge

# GITHUB_TOKEN 触发的 squash 合并不会触发 push CI，导致 main 缺少必需
# check-runs，D1 Pre-Flight 必然失败。因此仅在配置了 PAT
# （MAREF_AUTOMERGE_TOKEN，需 repo scope）时启用 auto-merge；未配置时
# 保持只读并提示人工合并。本 job 不 checkout/执行 PR 代码，仅读取元数据。
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # 以 PR 作者判定而非事件 actor：维护者对 Dependabot 分支 rebase 后
    # 触发的 synchronize 事件 actor 是维护者，但内容仍完全来自 Dependabot。
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      # 历史背景：原 action 依赖评论合并会被 cla-assistant 永久 pending 阻塞，
      # 故改用 GitHub 原生 auto-merge。
      - name: Classify update type
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 不 checkout 仓库，gh 需显式知道目标仓库。
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # update-type 元数据在 Dependabot 提交信息的 trailer 里，不在 PR body。
          commits=$(gh pr view "$PR" --json commits \
              --jq '[.commits[].messageBody // ""] | join("\n")') || {
            echo "::error::failed to read PR commits; refusing to classify"
            exit 1
          }
          if grep -q 'version-update:semver-major' <<<"$commits"; then
            echo "major=true" >> "$GITHUB_OUTPUT"
          else
            echo "major=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable auto-merge with PAT
        if: steps.classify.outputs.major != 'true'
        env:
          AUTOMERGE_TOKEN: ${{ secrets.MAREF_AUTOMERGE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$AUTOMERGE_TOKEN" ]; then
            echo "::warning::MAREF_AUTOMERGE_TOKEN is not configured; PR #$PR requires manual merge"
            exit 0
          fi
          GH_TOKEN="$AUTOMERGE_TOKEN" gh pr merge "$PR" --auto --squash

      - name: Major update notice
        if: steps.classify.outputs.major == 'true'
        run: echo "::notice::major update; manual review required"
