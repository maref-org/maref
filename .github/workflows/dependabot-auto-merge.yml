name: Dependabot Auto-Merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto-merge patch/minor updates
        uses: ahmadnassri/action-dependabot-auto-merge@v2
        with:
          target: minor
          branch: main
          # GitHub Actions 无批准权限（仓库设置禁止），approve 必须显式关闭，
          # 否则每个 Dependabot 事件都会以 "not permitted to approve" 失败。
          approve: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
