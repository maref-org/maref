name: Audit Anchor Verification

# 离线复核已生成的审计锚点：只验证 manifest/anchors/令牌三者一致性与
# TSA 签名，不访问 TSA、不读取审计原文。锚点产物由 "Audit Chain Anchor"
# workflow（self-hosted）生成并上传为 artifact。

on:
  workflow_dispatch:
    inputs:
      anchor_run_id:
        description: "Audit Chain Anchor run ID (empty = latest successful run)"
        required: false
        type: string
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install verification dependencies
        # verify_public_report.py 依赖 maref.reporting（pydantic）与 Ed25519 验签链
        run: python3 -m pip install -e ".[identity]"

      - name: Resolve anchor run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.anchor_run_id }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_RUN_ID" ]; then
            run_id="$INPUT_RUN_ID"
          else
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow "Audit Chain Anchor" --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          fi
          echo "id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Note when no anchor run exists
        if: steps.run.outputs.id == ''
        run: echo "::notice::No successful 'Audit Chain Anchor' run found; nothing to verify."

      - name: Download anchor artifact
        if: steps.run.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ steps.run.outputs.id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "audit-anchors-*" \
            --dir anchor-assets

      - name: Verify anchors offline
        if: steps.run.outputs.id != ''
        run: |
          set -euo pipefail
          manifest=$(find anchor-assets -name ANCHOR_MANIFEST.json -print -quit)
          if [ -z "$manifest" ]; then
            echo "::error::artifact contains no ANCHOR_MANIFEST.json"
            exit 1
          fi
          python3 scripts/verify_anchor_manifest.py --dir "$(dirname "$manifest")"

      - name: Download published report bundle
        id: published
        run: |
          set -o pipefail
          found=false
          mkdir -p published
          if git fetch --depth=1 origin gh-pages:refs/remotes/origin/gh-pages \
             && git archive origin/gh-pages verify | tar -x -C published; then
            [ -f published/verify/latest.json ] && found=true
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"
          if [ "$found" != true ]; then
            echo "::notice::gh-pages has no verify/latest.json; report chain check skipped"
          fi

      - name: Select previous report for chain check
        id: chain
        if: steps.published.outputs.found == 'true'
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import glob
          import json

          latest = json.load(open("published/verify/latest.json", encoding="utf-8"))
          candidates = []
          for path in glob.glob("published/verify/report-*.json"):
              try:
                  report = json.load(open(path, encoding="utf-8"))
              except Exception:
                  continue
              if report.get("report_id") != latest.get("report_id"):
                  candidates.append((report.get("created_at", ""), path, report))
          if candidates:
              _, path, report = max(candidates, key=lambda item: item[0])
              print(f"previous_path={path}")
              print(f"previous_id={report['report_id']}")
          PY

      - name: Verify published report against anchor and gates
        if: steps.published.outputs.found == 'true'
        run: |
          set -euo pipefail
          ARGS=(--report published/verify/latest.json
                --pubkey published/verify/maref-report-signing.pub
                --anchor-root published/verify/anchors
                --gates-dir published/verify/gates)
          if [ -n "${{ steps.chain.outputs.previous_path }}" ]; then
            ARGS+=(--previous-report "${{ steps.chain.outputs.previous_path }}")
          fi
          python3 scripts/verify_public_report.py "${ARGS[@]}"
