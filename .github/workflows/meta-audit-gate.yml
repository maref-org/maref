name: Meta-Audit Gate

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:
    inputs:
      runtime_gate:
        description: 'Run the real runtime health gate (self-hosted runner required)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  path-consistency:
    # Gating job: catches audit-path split-brain and missing SSOT modules.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -e ".[dev,identity]" starlette

      - name: Path consistency gate
        env:
          MAREF_META_PATH: '.governance/meta'
          MAREF_AUDIT_PATH: '.governance'
        run: python -m maref.observability.path_guard

      - name: Reject external openclaw runtime paths
        run: |
          if grep -rn '/Volumes/1TB-M2/openclaw' src .github scripts \
              --include='*.py' --include='*.yml' --include='*.yaml' \
              --include='*.sh' --include='*.plist'; then
            echo "::error::external openclaw path found in runtime code"
            exit 1
          fi

      - name: Paths / audit-chain regression tests
        run: |
          pytest tests/test_paths_ssot.py \
                 tests/governance/test_audit_chain_verify.py \
                 tests/sidecar/test_phoenix_policy.py -q --no-cov

  meta-audit-smoke:
    # Smoke only: proves the monitor runs and emits a parseable report on a
    # clean runner. It is NOT a health gate; runtime gates live in the
    # deployment (launchd + meta_audit_gate.py) and the optional job below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -e ".[dev,identity]" starlette

      - name: Import self-check + fixture report
        env:
          MAREF_GAAS_ENABLED: 'false'
          MAREF_META_PATH: '.governance/meta'
          MAREF_AUDIT_PATH: '.governance'
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          import maref.observability.meta_monitor as meta_monitor  # noqa: F401
          from maref.observability.path_guard import assert_paths

          assert_paths()
          report = {
              "timestamp": time.time(),
              "fixture": True,
              "summary": {
                  "m0_passed": True,
                  "m1_passed": True,
                  "m2_passed": True,
                  "m3_passed": True,
                  "m4_passed": True,
              },
          }
          path = Path(".governance/meta/meta-monitor-report.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report))
          print("import ok; fixture report written")
          PY

      - name: Upload meta-audit report
        uses: actions/upload-artifact@v4
        with:
          name: meta-audit-report
          path: .governance/meta/meta-monitor-report.json
          retention-days: 7
          if-no-files-found: warn

      - name: Check report is present and parseable
        run: |
          python3 -c "
          import json
          from pathlib import Path
          path = Path('.governance/meta/meta-monitor-report.json')
          stdout_path = Path('/tmp/meta-monitor-stdout.json')
          if not path.exists():
              print(f'::error::meta-monitor report not generated: {path}')
              if stdout_path.exists():
                  tail = stdout_path.read_text(errors='replace').splitlines()[-15:]
                  print('--- meta-monitor stdout tail ---')
                  print('\n'.join(tail))
              raise SystemExit(1)
          try:
              report = json.loads(path.read_text())
          except json.JSONDecodeError as e:
              print(f'::error::meta-monitor report unparseable: {e}')
              raise SystemExit(1)
          summary = report.get('summary', {})
          for k in ('m0_passed', 'm1_passed', 'm2_passed', 'm3_passed', 'm4_passed'):
              v = summary.get(k)
              label = 'PASS' if v is True else ('FAIL' if v is False else 'MISSING')
              print(f'{k}: {label}')
          print('::notice::CI smoke OK — this is not a runtime health gate')
          "

  meta-audit-runtime-gate:
    # Real gate. Enable by setting the repository variable
    # MAREF_RUNTIME_GATE=true and providing a self-hosted runner with the
    # deployment audit/meta data mounted.
    if: vars.MAREF_RUNTIME_GATE == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Runtime gate (M0-M3 required)
        env:
          MAREF_META_PATH: '.governance/meta'
          MAREF_AUDIT_PATH: '.governance'
        run: python scripts/meta_audit_gate.py --all
