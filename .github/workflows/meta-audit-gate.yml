name: Meta-Audit Gate

on:
  schedule:
    - cron: '17 4 * * *'  # Daily; attestation freshness is validated at 24h
  workflow_dispatch:
    inputs:
      attestation_ref:
        description: 'Branch holding the published runtime attestation'
        type: string
        default: 'attestations/latest'

permissions:
  contents: read
  issues: write

jobs:
  path-consistency:
    # Gating job: catches audit-path split-brain and missing SSOT modules.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e ".[dev,identity,sidecar]"

      - name: Path consistency gate
        env:
          MAREF_META_PATH: '.governance/meta'
          MAREF_AUDIT_PATH: '.governance'
        run: python -m maref.observability.path_guard

      - name: Reject external openclaw runtime paths
        run: |
          if grep -rnE '/Volumes/[^/]+/openclaw' src .github scripts \
              --include='*.py' --include='*.yml' --include='*.yaml' \
              --include='*.sh' --include='*.plist'; then
            echo "::error::external openclaw path found in runtime code"
            exit 1
          fi

      - name: Paths / audit-chain regression tests
        run: |
          pytest tests/test_paths_ssot.py \
                 tests/governance/test_audit_chain_verify.py \
                 tests/sidecar/test_phoenix_policy.py -q --no-cov

  meta-audit-smoke:
    # Proves the gate script is wired up and fails closed: the healthy
    # fixture must pass and an injected all_passed=false must not.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e ".[dev,identity,sidecar]"

      - name: Import self-check + fixture report
        env:
          MAREF_GAAS_ENABLED: 'false'
          MAREF_META_PATH: '.governance/meta'
          MAREF_AUDIT_PATH: '.governance'
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          import maref.observability.meta_monitor as meta_monitor  # noqa: F401
          from maref.observability.path_guard import assert_paths

          assert_paths()
          report = {
              "timestamp": time.time(),
              "fixture": True,
              "summary": {
                  "m0_passed": True,
                  "m1_passed": True,
                  "m2_passed": True,
                  "m3_passed": True,
                  "m4_passed": True,
                  "all_passed": True,
              },
          }
          path = Path(".governance/meta/meta-monitor-report.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report))
          print("import ok; fixture report written")
          PY

      - name: Upload meta-audit report
        uses: actions/upload-artifact@v7
        with:
          name: meta-audit-report
          path: .governance/meta/meta-monitor-report.json
          retention-days: 7
          if-no-files-found: warn

      - name: Check report is present and parseable
        run: |
          python3 -c "
          import json
          from pathlib import Path
          path = Path('.governance/meta/meta-monitor-report.json')
          stdout_path = Path('/tmp/meta-monitor-stdout.json')
          if not path.exists():
              print(f'::error::meta-monitor report not generated: {path}')
              if stdout_path.exists():
                  tail = stdout_path.read_text(errors='replace').splitlines()[-15:]
                  print('--- meta-monitor stdout tail ---')
                  print('\n'.join(tail))
              raise SystemExit(1)
          try:
              report = json.loads(path.read_text())
          except json.JSONDecodeError as e:
              print(f'::error::meta-monitor report unparseable: {e}')
              raise SystemExit(1)
          summary = report.get('summary', {})
          for k in ('m0_passed', 'm1_passed', 'm2_passed', 'm3_passed', 'm4_passed'):
              v = summary.get(k)
              label = 'PASS' if v is True else ('FAIL' if v is False else 'MISSING')
              print(f'{k}: {label}')
          "

      - name: Gate accepts healthy fixture and rejects unhealthy fixture
        run: |
          set -euo pipefail
          healthy=.governance/meta/meta-monitor-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('.governance/meta/meta-monitor-report.json').read_text())
          data['summary']['m2_passed'] = False
          data['summary']['all_passed'] = False
          Path('/tmp/unhealthy-report.json').write_text(json.dumps(data))
          PY
          python3 scripts/meta_audit_gate.py --report "$healthy" --all
          if python3 scripts/meta_audit_gate.py --report /tmp/unhealthy-report.json --all; then
            echo "::error::gate accepted an all_passed=false report"
            exit 1
          fi
          if python3 scripts/meta_audit_gate.py --report /tmp/unhealthy-report.json --require m0; then
            echo "::error::narrow --require masked all_passed=false"
            exit 1
          fi
          echo "::notice::gate is falsifiable (healthy=0, unhealthy!=0)"

  runtime-attest-verify:
    # Verifies the signed attestation published by the deployment against the
    # Ed25519 public key pinned on this branch. Never gates itself off: a
    # missing ref or key is a failure, not a skip.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install crypto dependency
        run: pip install cryptography

      - name: Fetch published attestation
        run: |
          set -euo pipefail
          ref="${{ github.event.inputs.attestation_ref || 'attestations/latest' }}"
          if ! git fetch --depth=1 origin "+refs/heads/$ref:refs/attestation/latest"; then
            echo "::error::attestation ref '$ref' is not published — runtime attestation missing"
            exit 1
          fi
          sha="$(git rev-parse refs/attestation/latest)"
          git show refs/attestation/latest:runtime_attest.json > /tmp/runtime_attest.json
          echo "attestation ref: $ref @ $sha"
          echo "attestation_sha=$sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Pinned key exists
        run: |
          set -euo pipefail
          key=configs/runtime-attest-public.pem
          if [ ! -f "$key" ]; then
            echo "::error::pinned public key $key is missing — attestation cannot be trusted"
            exit 1
          fi

      - name: Verify signature, freshness and health
        run: |
          set -euo pipefail
          python3 scripts/verify_runtime_attest.py \
            --attest /tmp/runtime_attest.json \
            --public-key configs/runtime-attest-public.pem \
            --require-healthy \
            --json | tee /tmp/attest-verify.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/attest-verify.json').read_text())
          print(f"verified: {result['verified']}")
          print(f"key_id: {result['detail']['key_id']}")
          print(f"age_seconds: {result['detail']['age_seconds']}")
          print(f"all_passed: {result['detail']['all_passed']}")
          PY
