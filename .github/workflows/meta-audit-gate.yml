name: Meta-Audit Gate

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:
    inputs:
      single_run:
        description: 'Run once and report'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  meta-audit-m0-m3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install -e ".[dev,identity]" starlette
          
      - name: Run meta-monitor — M0 Survivability (CI smoke)
        env:
          MAREF_HMAC_SECRET_KEY: ${{ secrets.MAREF_HMAC_SECRET_KEY || '' }}
          MAREF_ED25519_PRIVATE_KEY: ${{ secrets.MAREF_ED25519_PRIVATE_KEY || '' }}
          MAREF_GAAS_ENABLED: 'false'
          MAREF_META_PATH: '.openclaw'
        run: |
          # CI smoke: 运行时数据 gate (M0 audit_log / M3 freshness / M4 telemetry)
          # 依赖部署环境；干净 CI runner 无数据源，all_passed 不能作为 CI 契约。
          # 报告存在性 + 可解析性才是 CI 冒烟契约 (Check 步骤验证)；
          # 真实健康门禁由部署环境 run_loop (--daemon) 承担。
          python -m maref.observability.meta_monitor --single-run > /tmp/meta-monitor-stdout.json 2>&1 || true
          
      - name: Upload meta-audit report
        uses: actions/upload-artifact@v4
        with:
          name: meta-audit-report
          path: .openclaw/meta-monitor-report.json
          retention-days: 7
          
      - name: Check meta-audit result (CI smoke)
        run: |
          python3 -c "
          import json
          from pathlib import Path
          path = Path('.openclaw/meta-monitor-report.json')
          stdout_path = Path('/tmp/meta-monitor-stdout.json')
          if not path.exists():
              print(f'::error::meta-monitor report not generated: {path}')
              if stdout_path.exists():
                  tail = stdout_path.read_text(errors='replace').splitlines()[-15:]
                  print('--- meta-monitor stdout tail ---')
                  print('\n'.join(tail))
              raise SystemExit(1)
          try:
              report = json.loads(path.read_text())
          except json.JSONDecodeError as e:
              print(f'::error::meta-monitor report unparseable: {e}')
              raise SystemExit(1)
          summary = report.get('summary', {})
          for k in ('m0_passed', 'm1_passed', 'm2_passed', 'm3_passed', 'm4_passed'):
              v = summary.get(k)
              label = 'PASS' if v is True else ('FAIL' if v is False else 'MISSING')
              print(f'{k}: {label}')
          print('::notice::CI smoke OK — runtime data gates are evaluated by the deployment run_loop')
          "
