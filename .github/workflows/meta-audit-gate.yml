name: Meta-Audit Gate

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:
    inputs:
      single_run:
        description: 'Run once and report'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  meta-audit-m0-m3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install -e ".[dev,sidecar,otel,a2a,orchestration,identity]"
          
      - name: Run meta-monitor — M0 Survivability
        env:
          MAREF_HMAC_SECRET_KEY: ${{ secrets.MAREF_HMAC_SECRET_KEY || '' }}
          MAREF_ED25519_PRIVATE_KEY: ${{ secrets.MAREF_ED25519_PRIVATE_KEY || '' }}
          MAREF_GAAS_ENABLED: 'false'
          MAREF_META_PATH: '.openclaw'
        run: |
          python -m maref.observability.meta_monitor --single-run
          
      - name: Upload meta-audit report
        uses: actions/upload-artifact@v4
        with:
          name: meta-audit-report
          path: .openclaw/meta-monitor-report.json
          retention-days: 7
          
      - name: Check meta-audit result
        run: |
          python3 -c "
          import json
          path = '.openclaw/meta-monitor-report.json'
          with open(path) as f:
              report = json.load(f)
          summary = report.get('summary', {})
          print(f'M0: {\"PASS\" if summary.get(\"m0_passed\") else \"FAIL\"}')
          print(f'M1: {\"PASS\" if summary.get(\"m1_passed\") else \"FAIL\"}')
          print(f'M2: {\"PASS\" if summary.get(\"m2_passed\") else \"FAIL\"}')
          print(f'M3: {\"PASS\" if summary.get(\"m3_passed\") else \"FAIL\"}')
          print(f'ALL: {\"PASS\" if summary.get(\"all_passed\") else \"FAIL\"}')
          if not summary.get('all_passed'):
              print('::warning::Meta-audit gate failure detected')
              exit(1)
          "
