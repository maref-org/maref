name: Docs
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '!docs/website/**'
  pull_request:
    paths:
      - 'docs/**'
      - '!docs/website/**'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: docs/website/package-lock.json
      - run: npm ci
      - run: npm run build
