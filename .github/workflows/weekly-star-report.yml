name: Weekly Star Report

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      discussions: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate Star Report
        uses: actions/github-script@v7
        with:
          script: |
            const { data: repo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const { data: stargazers } = await github.rest.activity.listStargazersForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const stars = repo.stargazers_count;
            const growth = stargazers.length;
            const body = `## ⭐ 社区周报 — ${new Date().toISOString().slice(0, 10)}

            | 指标 | 数值 |
            |------|------|
            | 总 Star | ${stars} |
            | 本周新增 | ${growth} |
            | 本周贡献者 | ${repo.contributors_count || '-'} |
            | Fork | ${repo.forks_count} |

            🎉 感谢大家的支持！
            `;
            await github.rest.discussions.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⭐ 社区周报 #${context.run_number} — ${stars} Stars`,
              body: body,
              category: 'Announcements',
            });
