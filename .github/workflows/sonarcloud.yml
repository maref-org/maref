name: SonarCloud Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    # Dependabot PR 无法读取仓库 secrets（SONAR_TOKEN 为空），分析必然以
    # "Not authorized" 失败并阻塞其合并；主分支与人工 PR 照常分析。
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[ml,sidecar,dev,desktop,identity,orchestration,otel,a2a]"
      - name: Run tests with coverage
        run: |
          # pytest-cov 单层收集(同 ci.yml)：coverage run -m pytest 与 pyproject
          # addopts --cov(pytest-cov) 双层 coverage 会 collector 冲突。
          # 测试选择与 ci.yml 对齐：slow/real 依赖本机 git 历史或硬件，
          # desktop 为 macOS 套件，均不在 ubuntu 无头环境执行。
          pytest tests/ -q --timeout=120 -m "not integration and not chaos and not benchmark and not slow and not real" --ignore=tests/maref/compliance --ignore=tests/desktop --ignore=tests/test_crypto.py --cov-report=xml:coverage.xml
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
