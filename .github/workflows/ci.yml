name: MAREF CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev,sidecar,otel,a2a,orchestration,identity]"
      - name: Ruff lint
        run: ruff check src/maref src/maref_lite
      - name: Ruff format check
        run: ruff format --check src/maref src/maref_lite
      - name: Mypy type check
        run: mypy src/maref src/maref_lite

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev,sidecar,otel,a2a,orchestration,identity]"
      - name: Run unit tests
        run: |
          # 排除 slow(依赖本机 git tags/历史等环境) / real(需硬件/权限) /
          # integration / chaos / benchmark。排除 compliance(独立合规域)。
          # tests/desktop(40 文件)是 macOS 桌面代理套件，依赖 desktop extra
          # (Pillow/PyAutoGUI/playwright)与真实桌面，不适合 ubuntu 无头 CI——
          # 由 macOS 环境/本地覆盖；tests/maref/desktop 无头子集已在本 job 跑。
          # chaos marker 由独立 chaos-test job 覆盖，chaos_engine 等 simulate
          # 模式测试在 ubuntu 无头可跑。
          # 用 pytest-cov(addopts --cov)收集而非 coverage run 外层：
          # coverage run -m pytest 与 pyproject addopts 的 --cov(pytest-cov)
          # 形成双层 coverage，collector 冲突 (Expected current collector)。
          # crypto 由独立 crypto-test job 专职(密码学关键域隔离)，此处排除免双跑。
          pytest tests/ -x -q --timeout=120 -m "not integration and not chaos and not benchmark and not slow and not real" --ignore=tests/maref/compliance --ignore=tests/desktop --ignore=tests/test_crypto.py
      - name: Validate mock consistency
        if: github.event_name != 'pull_request'
        run: |
          # mock/schema 一致性校验(push 真 gate)：vault 数据变更若不同步
          # schema 会导致 mocks 失效。validator 本地验证无 mismatch 故 gate。
          python -c "from pathlib import Path; from maref.testing.mock_validator import MockValidator; v=MockValidator(schema_dir=Path('vault/schemas'), mock_dir=Path('vault/mocks')); errors=v.validate_all(); assert not errors, 'Mock mismatch: ' + str(errors)"
      - name: Coverage report
        run: coverage report --fail-under=50

  security:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev,sidecar,otel,a2a]"
      - name: Bandit SAST
        run: |
          pip install bandit
          # gate：只高严重度(High)使失败。Medium/Low 是噪音(如 mock/测试
          # 辅助的模式), 不阻断。当前 src 无 High(bandit --severity-level high)。
          bandit -r src/ -c pyproject.toml --severity-level high
      - name: pip-audit
        run: |
          pip install pip-audit
          # 升级环境自带 setuptools（PYSEC-2026-3447，pip 构建工具非项目依赖）
          pip install -U "setuptools>=83"
          pip-audit

  integrity:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded passed=True in validation code
        run: |
          # 禁止验证代码中硬编码 passed=True（T0-1 诚信修复项）
          if grep -rn "passed=True" src/maref/recursive/tla_replay.py 2>/dev/null; then
            echo "ERROR: tla_replay.py still contains hardcoded passed=True"
            exit 1
          fi
          echo "✅ No hardcoded passed=True in validation code"
      - name: Check for remaining 64-state claims
        run: |
          # 禁止"64-state"夸大声明。排除已核实的 3 个历史记录文件(逐文件
          # 白名单, 非目录通配)：诚信修复声明/执行日志/治理审计报告中的
          # 64-state 字样是修复过程的如实记载, 非当前产品声明。
          # 新增文件若含 64-state 必须显式加入此白名单并人工核验。
          EXCLUDE="docs/INTEGRITY_DECLARATION\.md|docs/execution-logs/el-20260728-v0\.39\.1-诚信修复\.md|docs/gov-audit-report\.md"
          FILES=$(grep -rl "64.state" --include="*.md" .github/ .wiki/ docs/ website/ 2>/dev/null | grep -vE "^($EXCLUDE)" || true)
          if [ -n "$FILES" ]; then
            echo "ERROR: Found remaining '64-state' claims in:"
            echo "$FILES"
            exit 1
          fi
          echo "✅ No 64-state claims remain"
      - name: Check for Sperner claims
        run: |
          # 同上：逐文件白名单(仅 3 个已核实历史记录文件)
          EXCLUDE="docs/INTEGRITY_DECLARATION\.md|docs/execution-logs/el-20260728-v0\.39\.1-诚信修复\.md|docs/gov-audit-report\.md"
          FILES=$(grep -rl "Sperner" --include="*.md" .github/ .wiki/ docs/ website/ README* 2>/dev/null | grep -vE "^($EXCLUDE)" || true)
          if [ -n "$FILES" ]; then
            echo "ERROR: Found remaining Sperner claims in:"
            echo "$FILES"
            exit 1
          fi
          echo "✅ No Sperner claims remain"
      - name: Check for 82% coverage claims in product-facing docs
        run: |
          # Check product-facing docs only (README, wiki, website product pages)
          # Skip plans/, research/, changelog (internal/historical records)
          for f in README.md README.zh-CN.md .wiki/Home.md website/src/content/pages/product-overview.md docs/MAREF-Technical-Whitepaper-arXiv.md; do
            if [ -f "$f" ] && grep -q "82%" "$f" 2>/dev/null; then
              if grep -qi "cover" "$f" 2>/dev/null; then
                echo "ERROR: $f still has 82% coverage claim"
                exit 1
              fi
            fi
          done
          echo "✅ No 82% coverage claims in product-facing docs"

  crypto-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev,sidecar,otel,a2a,orchestration,identity]"
      - name: Run cryptography tests
        run: |
          # --no-cov：crypto-test 只验证密码学功能，addopts 的 --cov=src
          # (pytest-cov) 会因仅 8 个测试覆盖率 0.1% < fail_under=50 误失败。
          pytest tests/test_crypto.py -v --no-cov

  chaos-test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev,sidecar,otel,a2a,orchestration,identity]"
      - name: Run chaos tests
        run: |
          # simulate 类 chaos(引擎/guardrails 故障注入)在无真实系统破坏下可跑，
          # 52 测试本地 ~11s。主 test job 排除 chaos marker，此处专门防回归。
          # ignore: desktop/compliance(依赖 desktop extra/合规域)、
          # disaster_recovery(调真实 backup.sh 做文件系统备份, CI ubuntu 归档
          # 0 bytes 失败——真实 DR 集成测试, 需真实 tar/数据环境, 本地/专用跑)。
          pytest tests/ -m "chaos and not real and not slow" -q --timeout=120 --no-cov --ignore=tests/desktop --ignore=tests/maref/compliance --ignore=tests/chaos/test_disaster_recovery.py
