name: MAREF CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/maref src/maref_lite
      - name: Ruff format check
        run: ruff format --check src/maref src/maref_lite
      - name: Mypy type check
        run: mypy src/maref src/maref_lite

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: |
          pytest tests/ -x -q --timeout=120 -m "not integration and not chaos and not benchmark" --cov=src --cov-report=xml
      - name: Validate mock consistency
        run: |
          python -c "
          from pathlib import Path
          from maref.testing.mock_validator import MockValidator
          v = MockValidator(schema_dir=Path('vault/schemas'), mock_dir=Path('vault/mocks'))
          errors = v.validate_all()
          assert not errors, f'Mock mismatch: {errors}'
          "

  security:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Bandit SAST
        run: bandit -r src/ -c .bandit
      - name: pip-audit
        run: pip-audit
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@v3.90.8
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  crypto-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run cryptography tests
        run: |
          pytest tests/compliance/test_crypto_sm2.py tests/compliance/test_crypto_sm3.py tests/compliance/test_crypto_sm4.py -v
