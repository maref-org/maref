name: MAREF CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev,sidecar,otel,a2a,orchestration,identity]"
      - name: Ruff lint
        run: ruff check src/maref src/maref_lite
      - name: Ruff format check
        run: ruff format --check src/maref src/maref_lite
      - name: Mypy type check
        run: mypy src/maref src/maref_lite

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev,sidecar,otel,a2a,orchestration,identity,desktop]"
      - name: Run unit tests
        # pytest addopts 已带 --cov (pytest-cov)。外层再包 coverage run 会与
        # pytest-cov 抢同一个 .coverage 文件, 后者退出时把数据覆盖成空,
        # 导致 Coverage report 步骤读到 0.00%。只用 pytest-cov 作为数据源。
        run: |
          python -m pytest tests/ -x -q --timeout=120 -m "not integration and not chaos and not benchmark and not real" --ignore=tests/maref/compliance
      - name: Validate mock consistency
        if: github.event_name != 'pull_request'
        run: |
          python -c "from maref.testing.mock_validator import MockValidator; v=MockValidator(schema_dir=Path('vault/schemas'), mock_dir=Path('vault/mocks')); errors=v.validate_all(); assert not errors, 'Mock mismatch: ' + str(errors)"
        continue-on-error: true
      - name: Coverage report
        run: coverage report --fail-under=50

  security:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev,sidecar,otel,a2a]"
      - name: Bandit SAST
        run: bandit -r src/ -c pyproject.toml || true
      - name: pip-audit
        run: |
          pip install pip-audit
          pip install --upgrade "setuptools>=83.0.0"
          pip-audit
      - name: TruffleHog Secret Scan
        run: |
          # PyPI 的 trufflehog 2.x CLI 不兼容 filesystem 子命令，且 .trufflehog.yaml
          # 为 2.x 过时格式（3.x --config 期望 protobuf）。改用官方二进制。
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
          # --exclude-detectors=Lob: test_ 前缀测试函数名被 Lob detector 误报
          trufflehog filesystem . --only-verified --exclude-paths .trufflehogignore --exclude-detectors=Lob --no-update

  integrity:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded passed=True in validation code
        run: |
          # 禁止验证代码中硬编码 passed=True（T0-1 诚信修复项）
          if grep -rn "passed=True" src/maref/recursive/tla_replay.py 2>/dev/null; then
            echo "ERROR: tla_replay.py still contains hardcoded passed=True"
            exit 1
          fi
          echo "✅ No hardcoded passed=True in validation code"
      - name: Check for remaining 64-state claims
        run: |
          # 禁止"64-state"夸大声明
          # 豁免历史执行日志与诚信声明（描述性引用，与 82% 检查豁免历史记录一致）
          FILES=$(grep -rl "64.state" --include="*.md" --exclude-dir=execution-logs --exclude="INTEGRITY_DECLARATION.md" .github/ .wiki/ docs/ website/ 2>/dev/null || true)
          if [ -n "$FILES" ]; then
            echo "ERROR: Found remaining '64-state' claims in:"
            echo "$FILES"
            exit 1
          fi
          echo "✅ No 64-state claims remain"
      - name: Check for Sperner claims
        run: |
          # 禁止残留 Sperner 夸大声明
          # 豁免历史执行日志与诚信声明/审计报告（描述删除虚假声明的过程，与 64-state 检查一致）
          FILES=$(grep -rl "Sperner" --include="*.md" --exclude-dir=execution-logs --exclude="INTEGRITY_DECLARATION.md" --exclude="gov-audit-report.md" .github/ .wiki/ docs/ website/ README* 2>/dev/null || true)
          if [ -n "$FILES" ]; then
            echo "ERROR: Found remaining Sperner claims in:"
            echo "$FILES"
            exit 1
          fi
          echo "✅ No Sperner claims remain"
      - name: Check for 82% coverage claims in product-facing docs
        run: |
          # Check product-facing docs only (README, wiki, website product pages)
          # Skip plans/, research/, changelog (internal/historical records)
          for f in README.md README.zh-CN.md .wiki/Home.md website/src/content/pages/product-overview.md docs/MAREF-Technical-Whitepaper-arXiv.md; do
            if [ -f "$f" ] && grep -q "82%" "$f" 2>/dev/null; then
              if grep -qi "cover" "$f" 2>/dev/null; then
                echo "ERROR: $f still has 82% coverage claim"
                exit 1
              fi
            fi
          done
          echo "✅ No 82% coverage claims in product-facing docs"

  crypto-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev,sidecar,otel,a2a,orchestration,identity]"
      - name: Run cryptography tests
        run: |
          pytest tests/test_crypto.py -v
