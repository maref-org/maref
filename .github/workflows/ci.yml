name: MAREF CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev,sidecar,otel,a2a,orchestration,identity]"
      - name: Ruff lint
        run: ruff check src/maref src/maref_lite
      - name: Ruff format check
        run: ruff format --check src/maref src/maref_lite
      - name: Mypy type check
        run: mypy src/maref src/maref_lite

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev,sidecar,otel,a2a,orchestration,identity]"
      - name: Run unit tests
        env:
          # 隔离主 coverage 数据文件到 /tmp：测试内部 spawn 的嵌套 coverage
          # (evolution/real_metrics 等真实跑 pytest+coverage 子进程) 若写默认
          # .coverage 会覆盖主收集数据，导致后续 coverage report 读到空/损坏。
          COVERAGE_FILE: /tmp/maref-ci.coverage
        run: |
          # 排除 slow(依赖本机 git tags/历史等环境) / real(需硬件/权限) /
          # integration / chaos / benchmark。排除 compliance(独立合规域) 与
          # desktop(需 desktop extra/Pillow + 桌面环境)。
          # desktop 测试由专门环境覆盖，见 STATE.yaml 分域记录。
          coverage run -m pytest tests/ -x -q --timeout=120 -m "not integration and not chaos and not benchmark and not slow and not real" --ignore=tests/maref/compliance --ignore=tests/desktop
      - name: Validate mock consistency
        if: github.event_name != 'pull_request'
        run: |
          python -c "from pathlib import Path; from maref.testing.mock_validator import MockValidator; v=MockValidator(schema_dir=Path('vault/schemas'), mock_dir=Path('vault/mocks')); errors=v.validate_all(); assert not errors, 'Mock mismatch: ' + str(errors)"
        continue-on-error: true
      - name: Coverage report
        env:
          COVERAGE_FILE: /tmp/maref-ci.coverage
        run: coverage report --fail-under=50

  security:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev,sidecar,otel,a2a]"
      - name: Bandit SAST
        run: |
          pip install bandit
          bandit -r src/ -c pyproject.toml || true
      - name: pip-audit
        run: |
          pip install pip-audit
          # 升级环境自带 setuptools（PYSEC-2026-3447，pip 构建工具非项目依赖）
          pip install -U "setuptools>=83"
          pip-audit
      - name: TruffleHog Secret Scan
        run: |
          pip install trufflehog
          # Secret 扫描由独立 security-scan.yml 专职负责（官方 trufflesecurity
          # action）。此处仅作冗余快速检查；PyPI 的 trufflehog 仅为 2.x git
          # 扫描器（filesystem 需官方 3.x），容错避免阻塞主 CI。
          trufflehog filesystem . --only-verified --no-update || true

  integrity:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded passed=True in validation code
        run: |
          # 禁止验证代码中硬编码 passed=True（T0-1 诚信修复项）
          if grep -rn "passed=True" src/maref/recursive/tla_replay.py 2>/dev/null; then
            echo "ERROR: tla_replay.py still contains hardcoded passed=True"
            exit 1
          fi
          echo "✅ No hardcoded passed=True in validation code"
      - name: Check for remaining 64-state claims
        run: |
          # 禁止"64-state"夸大声明。排除历史记录类文档（诚信修复记录、
          # 执行日志、治理审计报告）：其中 64-state/Sperner 字样属对
          # 修复过程的如实记载或明确标记未验证，非当前产品声明。
          EXCLUDE="docs/INTEGRITY_DECLARATION\.md|docs/execution-logs|docs/gov-audit-report\.md"
          FILES=$(grep -rl "64.state" --include="*.md" .github/ .wiki/ docs/ website/ 2>/dev/null | grep -vE "^($EXCLUDE)" || true)
          if [ -n "$FILES" ]; then
            echo "ERROR: Found remaining '64-state' claims in:"
            echo "$FILES"
            exit 1
          fi
          echo "✅ No 64-state claims remain"
      - name: Check for Sperner claims
        run: |
          # 同上排除历史记录文档
          EXCLUDE="docs/INTEGRITY_DECLARATION\.md|docs/execution-logs|docs/gov-audit-report\.md"
          FILES=$(grep -rl "Sperner" --include="*.md" .github/ .wiki/ docs/ website/ README* 2>/dev/null | grep -vE "^($EXCLUDE)" || true)
          if [ -n "$FILES" ]; then
            echo "ERROR: Found remaining Sperner claims in:"
            echo "$FILES"
            exit 1
          fi
          echo "✅ No Sperner claims remain"
      - name: Check for 82% coverage claims in product-facing docs
        run: |
          # Check product-facing docs only (README, wiki, website product pages)
          # Skip plans/, research/, changelog (internal/historical records)
          for f in README.md README.zh-CN.md .wiki/Home.md website/src/content/pages/product-overview.md docs/MAREF-Technical-Whitepaper-arXiv.md; do
            if [ -f "$f" ] && grep -q "82%" "$f" 2>/dev/null; then
              if grep -qi "cover" "$f" 2>/dev/null; then
                echo "ERROR: $f still has 82% coverage claim"
                exit 1
              fi
            fi
          done
          echo "✅ No 82% coverage claims in product-facing docs"

  crypto-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev,sidecar,otel,a2a,orchestration,identity]"
      - name: Run cryptography tests
        run: |
          pytest tests/test_crypto.py -v
