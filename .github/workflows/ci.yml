name: MAREF CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev,sidecar,otel,a2a,orchestration,identity]"
      - name: Ruff lint
        run: ruff check src/maref src/maref_lite
      - name: Ruff format check
        run: ruff format --check src/maref src/maref_lite
      - name: Mypy type check
        run: mypy src/maref src/maref_lite

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — git-tag dependent tests (test_r1_self_observer) need
      # the full tag history; shallow clone yields zero tags on CI.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev,desktop,sidecar,otel,a2a,orchestration,identity]"
      - name: Run unit tests
        run: |
          coverage run -m pytest tests/ -x -q --timeout=120 -m "not integration and not chaos and not benchmark and not real" --ignore=tests/maref/compliance
      - name: Validate mock consistency
        if: github.event_name != 'pull_request'
        run: |
          python -c "from maref.testing.mock_validator import MockValidator; v=MockValidator(schema_dir=Path('vault/schemas'), mock_dir=Path('vault/mocks')); errors=v.validate_all(); assert not errors, f'Mock mismatch: {errors}'"
        continue-on-error: true
      - name: Coverage report
        run: coverage report --fail-under=50

  security:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev,sidecar,otel,a2a]"
      - name: Bandit SAST
        run: bandit -r src/ -c pyproject.toml || true
      - name: pip-audit
        run: |
          pip install pip-audit
          # runner image's setuptools 79.0.1 has PYSEC-2026-3447; bump before audit
          pip install -U "setuptools>=83.0.0"
          pip-audit
      - name: TruffleHog Secret Scan
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@v3.90.8
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified --exclude-paths .trufflehogignore

  integrity:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded passed=True in validation code
        run: |
          # 禁止验证代码中硬编码 passed=True（T0-1 诚信修复项）
          if grep -rn "passed=True" src/maref/recursive/tla_replay.py 2>/dev/null; then
            echo "ERROR: tla_replay.py still contains hardcoded passed=True"
            exit 1
          fi
          echo "✅ No hardcoded passed=True in validation code"
      - name: Check for remaining 64-state claims
        run: |
          # 禁止"64-state"夸大声明
          # 豁免 execution-logs/ 与 INTEGRITY_DECLARATION.md：其仅记录"64-state→34-state 已修正"历史
          FILES=$(grep -rl "64.state" --include="*.md" .github/ .wiki/ docs/ website/ 2>/dev/null | grep -vE "execution-logs|INTEGRITY_DECLARATION" || true)
          if [ -n "$FILES" ]; then
            echo "ERROR: Found remaining '64-state' claims in:"
            echo "$FILES"
            exit 1
          fi
          echo "✅ No 64-state claims remain"
      - name: Check for Sperner claims
        run: |
          # 豁免 execution-logs/、INTEGRITY_DECLARATION.md、gov-audit-report.md：仅记录修复历史/审计事实
          if grep -rl "Sperner" --include="*.md" .github/ .wiki/ docs/ website/ README* 2>/dev/null | grep -vE "execution-logs|INTEGRITY_DECLARATION|gov-audit-report"; then
            echo "ERROR: Found remaining Sperner claims"
            exit 1
          fi
          echo "✅ No Sperner claims remain"
      - name: Check for 82% coverage claims in product-facing docs
        run: |
          # Check product-facing docs only (README, wiki, website product pages)
          # Skip plans/, research/, changelog (internal/historical records)
          for f in README.md README.zh-CN.md .wiki/Home.md website/src/content/pages/product-overview.md docs/MAREF-Technical-Whitepaper-arXiv.md; do
            if [ -f "$f" ] && grep -q "82%" "$f" 2>/dev/null; then
              if grep -qi "cover" "$f" 2>/dev/null; then
                echo "ERROR: $f still has 82% coverage claim"
                exit 1
              fi
            fi
          done
          echo "✅ No 82% coverage claims in product-facing docs"

  crypto-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev,sidecar,otel,a2a,orchestration,identity]"
      - name: Run cryptography tests
        run: |
          pytest tests/test_crypto.py -v
