name: Formal Verification

on:
  push:
    paths:
      - 'experiments/formal/**'
  pull_request:
    paths:
      - 'experiments/formal/**'
  workflow_dispatch:

jobs:
  tla-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup TLA+ Tools
        run: |
          mkdir -p ~/tla2tools
          curl -sL https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar \
            -o ~/tla2tools/tla2tools.jar

      - name: Validate MarefLiteModel
        id: maref-lite
        continue-on-error: true
        run: |
          echo "=== SANY Parse ==="
          java -cp ~/tla2tools/tla2tools.jar tla2sany.SANY experiments/formal/MarefLiteModel.tla || true
          echo "=== TLC Model Check ==="
          java -cp ~/tla2tools/tla2tools.jar \
            tlc2.TLC \
            experiments/formal/MarefLiteModel.tla \
            -config experiments/formal/MarefLiteMC.cfg \
            -deadlock \
            -workers auto \
            -coverage 1 \
            | tee experiments/formal/MarefLite_result.txt
          grep -q "Model checking completed" experiments/formal/MarefLite_result.txt && \
            echo "✅ MarefLite FSM verified"

      - name: Validate Consensus Protocol
        id: consensus
        continue-on-error: true
        run: |
          echo "=== SANY Parse ==="
          java -cp ~/tla2tools/tla2tools.jar tla2sany.SANY experiments/formal/MAREF_Consensus.tla || true
          echo "=== TLC Model Check ==="
          java -cp ~/tla2tools/tla2tools.jar \
            tlc2.TLC \
            experiments/formal/MAREF_Consensus.tla \
            -config experiments/formal/MAREF_ConsensusMC.cfg \
            -deadlock \
            -workers auto \
            -coverage 1 \
            | tee experiments/formal/Consensus_result.txt
          grep -q "Model checking completed" experiments/formal/Consensus_result.txt && \
            echo "✅ Consensus protocol verified"

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tla-verification-results
          path: experiments/formal/*_result.txt