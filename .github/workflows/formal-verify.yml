name: Formal Verification

on:
  push:
    paths:
      - 'experiments/formal/**'
  pull_request:
    paths:
      - 'experiments/formal/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tla-verify-mareflite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup TLA+ Tools
        run: |
          mkdir -p ~/tla2tools
          curl -sL https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar \
            -o ~/tla2tools/tla2tools.jar

      - name: Validate MarefLiteModel
        run: |
          java -cp ~/tla2tools/tla2tools.jar \
            tlc2.TLC \
            experiments/formal/MarefLiteModel.tla \
            -config experiments/formal/MarefLiteMC.cfg \
            -deadlock \
            -workers auto \
            -coverage 1 \
            | tee experiments/formal/MarefLite_result.txt
          grep -q "Model checking completed" experiments/formal/MarefLite_result.txt && \
            echo "✅ MarefLite FSM verified"

      - name: Upload MarefLite results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mareflite-results
          path: experiments/formal/MarefLite_result.txt

  tla-verify-consensus:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup TLA+ Tools
        run: |
          mkdir -p ~/tla2tools
          curl -sL https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar \
            -o ~/tla2tools/tla2tools.jar

      - name: Validate Consensus Protocol
        run: |
          java -cp ~/tla2tools/tla2tools.jar \
            tlc2.TLC \
            experiments/formal/MAREF_Consensus.tla \
            -config experiments/formal/MAREF_ConsensusMC.cfg \
            -deadlock \
            -workers auto \
            -coverage 1 \
            | tee experiments/formal/Consensus_result.txt
          grep -q "Model checking completed" experiments/formal/Consensus_result.txt && \
            echo "✅ Consensus protocol verified"

      - name: Upload Consensus results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consensus-results
          path: experiments/formal/Consensus_result.txt