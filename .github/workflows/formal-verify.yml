name: Formal Verification

on:
  push:
    paths:
      - 'src/formal/**'
      - 'src/maref/governance/**'
  pull_request:
    paths:
      - 'src/formal/**'
      - 'src/maref/governance/**'
  workflow_dispatch:

jobs:
  tla-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup TLA+
        run: |
          TLA_URL="https://github.com/tlaplus/tlaplus/releases/download/v1.7.1/tla2tools.jar"
          wget -q --retry-connrefused --waitretry=1 --read-timeout=20 --timeout=15 -t 3 "$TLA_URL" -O /tmp/tla2tools.jar || \
          curl -fsSL -o /tmp/tla2tools.jar "$TLA_URL"
      - name: Verify Gray Code FSM
        run: |
          java -cp /tmp/tla2tools.jar tlc2.TLC src/formal/MarefLite.tla -config src/formal/MarefLiteMC.cfg
      - name: Verify Consensus
        run: |
          java -cp /tmp/tla2tools.jar tlc2.TLC src/formal/MAREF_Consensus.tla -config src/formal/MAREF_ConsensusMC.cfg
