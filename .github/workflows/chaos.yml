name: Chaos Engineering
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to kind
        run: |
          kind create cluster
          kubectl apply -f k8s/production/
      - name: Run chaos tests
        run: pytest tests/chaos/ -v --timeout=120
