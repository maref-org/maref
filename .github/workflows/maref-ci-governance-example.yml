name: MAREF CI Governance (example)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  governance-advisory:
    name: "Governance Scan (advisory)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: MAREF CI Governance Scan (advisory)
        uses: ./.github/actions/maref-ci-governance
        with:
          sidecar-url: "http://localhost:8000"
          mode: "advisory"
          fail-closed: "false"
          trust-score-mode: "advisory"
          trust-score-threshold: "0.7"

  governance-enforcing:
    name: "Governance Scan (enforcing) — Trust Score Enforcing Example"
    runs-on: ubuntu-latest
    # 该 job 需要外部 sidecar（localhost:8000）才能通过，属于" enforcing 模式示例"。
    # 2026-11-22 实测：旧条件 contains(head_ref, 'release') 会让任何
    # `chore/release-*` 分支必红（sidecar 根本没启动），而它不是必需 check，
    # 结果只是一颗误导性的红灯。改为**显式打标签**才触发。
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'enforce-governance')
    steps:
      - uses: actions/checkout@v7

      - name: MAREF CI Governance Scan (enforcing + Trust Score)
        uses: ./.github/actions/maref-ci-governance
        with:
          sidecar-url: "http://localhost:8000"
          mode: "enforcing"
          fail-closed: "true"
          trust-score-mode: "enforcing"
          trust-score-threshold: "0.7"
