name: Report Deploy — maref.cc/verify

# 发布链路：真实审计链 → 锚点清单 → 签名公开报告 → gh-pages
#
# 安全边界：
# - 只在 self-hosted（审计链所在主机）运行；审计原文不离开本机，只发布哈希与令牌。
# - 只由 schedule / workflow_dispatch 触发，绝不监听 pull_request——
#   公开仓库的 self-hosted runner 若被 fork PR 触发，等于允许任意代码执行。

on:
  schedule:
    # 22:30 UTC：本地治理循环 06:00（22:00 UTC）之后，抓取当日门禁摘要；
    # 锚点由同日 02:00 UTC 的 anchor-audit.yml 产出。
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: report-deploy
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: [self-hosted, macOS, maref-audit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install package dependencies
        # setup-python 在 self-hosted 上会硬编码写入 /Users/runner，这里用系统
        # python3 的 venv；identity extra 提供 gmssl/cryptography，签名链需要。
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -e ".[identity]"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Locate inputs
        id: inputs
        env:
          AUDIT_PATH: ${{ vars.MAREF_AUDIT_PATH }}
          GATES_PATH: ${{ vars.MAREF_REPORT_GATES_PATH }}
          ANCHORS_ROOT: ${{ vars.MAREF_ANCHORS_ROOT }}
        run: |
          set -euo pipefail
          for name in AUDIT_PATH GATES_PATH ANCHORS_ROOT; do
            [ -n "${!name}" ] || { echo "::error::missing repository variable $name"; exit 1; }
          done
          [ -f "$AUDIT_PATH" ] || { echo "::error::audit log not found: $AUDIT_PATH"; exit 1; }
          [ -f "$GATES_PATH" ] || { echo "::error::gates summary not found: $GATES_PATH"; exit 1; }
          anchor_dir=$(ls -1d "$ANCHORS_ROOT"/[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9] 2>/dev/null | tail -1)
          if [ -z "$anchor_dir" ] || [ ! -f "$anchor_dir/ANCHOR_MANIFEST.json" ]; then
            echo "::error::no anchor manifest under $ANCHORS_ROOT"
            exit 1
          fi
          echo "audit_path=$AUDIT_PATH" >> "$GITHUB_OUTPUT"
          echo "gates_path=$GATES_PATH" >> "$GITHUB_OUTPUT"
          echo "anchor_dir=$anchor_dir" >> "$GITHUB_OUTPUT"

      - name: Restore published history
        run: |
          # 每次 CI 工作区都是全新的，历史报告只存在于 gh-pages。不取回来的话，
          # 索引每次只含当天报告，历史报告会变成没人链接的孤儿文件。
          set -o pipefail
          rm -f /tmp/previous-report.json
          mkdir -p /tmp/gh-pages-history
          # 必须显式写 refspec：`git fetch origin gh-pages` 只更新 FETCH_HEAD，
          # 不会创建 origin/gh-pages，后面的 git archive 会直接失败。
          if git fetch --depth=1 origin gh-pages:refs/remotes/origin/gh-pages \
             && git archive origin/gh-pages verify | tar -x -C /tmp/gh-pages-history; then
            cp -n /tmp/gh-pages-history/verify/*.json docs/verify/ 2>/dev/null || true
            cp -n /tmp/gh-pages-history/verify/*.html docs/verify/ 2>/dev/null || true
            cp -n /tmp/gh-pages-history/verify/maref-report-signing.pub docs/verify/ 2>/dev/null || true
            cp -n /tmp/gh-pages-history/verify/latest.json /tmp/previous-report.json 2>/dev/null || true
            rm -f docs/verify/index.html
          else
            echo "No gh-pages history yet"
          fi

      - name: Stage public artifacts
        id: stage
        run: |
          set -euo pipefail
          DATE=$(basename "${{ steps.inputs.outputs.anchor_dir }}")
          mkdir -p "docs/verify/anchors/$DATE" docs/verify/gates
          cp "${{ steps.inputs.outputs.anchor_dir }}/ANCHOR_MANIFEST.json" "docs/verify/anchors/$DATE/"
          # 同日重跑时目标是已存在的目录，必须拷内容而不是拷目录，否则会出现 batches/batches
          mkdir -p "docs/verify/anchors/$DATE/batches"
          cp -R "${{ steps.inputs.outputs.anchor_dir }}/batches/." "docs/verify/anchors/$DATE/batches/"
          cp "${{ steps.inputs.outputs.anchor_dir }}/freetsa-cacert.pem" "docs/verify/anchors/$DATE/"
          # anchors.jsonl 只含批次哈希与 base64 令牌，第三方需要它复算 anchors_sha256
          cp "${{ steps.inputs.outputs.anchor_dir }}/anchors.jsonl" "docs/verify/anchors/$DATE/"
          # 发布副本必须先脱敏再计算哈希：报告绑定的 manifest_sha256 必须等于
          # 第三方下载到的这一个文件，否则验收第 3 条永远对不上。
          python - "docs/verify/anchors/$DATE/ANCHOR_MANIFEST.json" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path, encoding="utf-8") as fh:
              manifest = json.load(fh)
          manifest["audit_file"] = "<deployment-local>"
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          PY
          cp "${{ steps.inputs.outputs.gates_path }}" "docs/verify/gates/$DATE.json"
          cp "docs/verify/gates/$DATE.json" docs/verify/gates/latest.json
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Generate public report
        env:
          SIGNING_KEY: ${{ secrets.MAREF_REPORT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "::error::MAREF_REPORT_SIGNING_KEY 未配置 —— 签名身份必须跨报告稳定，不再回退到临时密钥"
            exit 1
          fi
          KEY="$RUNNER_TEMP/maref-report-signing.pem"
          printf '%s\n' "$SIGNING_KEY" > "$KEY"
          chmod 600 "$KEY"
          python - "$KEY" docs/verify/maref-report-signing.pub <<'PY'
          import sys

          from maref.signing.signing_key import ReportSigningKey

          ReportSigningKey.from_private_key_file(sys.argv[1]).save_public_key(sys.argv[2])
          PY
          PREV_ID=""
          if [ -f /tmp/previous-report.json ]; then
            PREV_ID=$(python -c "import json,sys;print(json.load(open(sys.argv[1], encoding='utf-8'))['report_id'])" /tmp/previous-report.json)
          fi
          python scripts/gen_public_report.py \
            --audit-log "${{ steps.inputs.outputs.audit_path }}" \
            --gates "docs/verify/gates/${{ steps.stage.outputs.date }}.json" \
            --anchor-manifest "docs/verify/anchors/${{ steps.stage.outputs.date }}/ANCHOR_MANIFEST.json" \
            --signing-key "$KEY" \
            --output docs/verify/latest.json \
            --previous-report-id "$PREV_ID"

      - name: Verify published report
        run: |
          set -euo pipefail
          DATE="${{ steps.stage.outputs.date }}"
          ARGS=(--report docs/verify/latest.json --pubkey docs/verify/maref-report-signing.pub
                --anchor-manifest "docs/verify/anchors/$DATE/ANCHOR_MANIFEST.json"
                --gates "docs/verify/gates/$DATE.json")
          if [ -f /tmp/previous-report.json ]; then
            ARGS+=(--previous-report /tmp/previous-report.json)
          fi
          python scripts/verify_public_report.py "${ARGS[@]}"

          # 负控制 N1：篡改报告任一字段，验签必须失败
          python - docs/verify/latest.json /tmp/n1.json <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          report["audit_summary"]["total_events"] += 1
          with open(sys.argv[2], "w", encoding="utf-8") as fh:
              json.dump(report, fh, ensure_ascii=False)
          PY
          if python scripts/verify_public_report.py --report /tmp/n1.json \
               --pubkey docs/verify/maref-report-signing.pub >/dev/null 2>&1; then
            echo "::error::N1 负控制失败：篡改后的报告仍然通过验签"
            exit 1
          fi

          # 负控制 N4：门禁摘要被改动后，必须与报告中的 evidence_sha256 不一致。
          # 只改字节、不改语义，确保即使当日全绿也能触发哈希不符。
          python - "docs/verify/gates/$DATE.json" /tmp/gates-tampered.json <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          data["gates"][0]["exit_code"] = 99
          with open(sys.argv[2], "w", encoding="utf-8") as fh:
              json.dump(data, fh, ensure_ascii=False)
          PY
          if python scripts/verify_public_report.py --report docs/verify/latest.json \
               --pubkey docs/verify/maref-report-signing.pub \
               --gates /tmp/gates-tampered.json >/dev/null 2>&1; then
            echo "::error::N4 负控制失败：门禁摘要被篡改后仍然通过复验"
            exit 1
          fi

      - name: Export HTML + index
        run: |
          TIMESTAMP=$(date -u +"%Y%m%dT%H%M%SZ")
          cp docs/verify/latest.json "docs/verify/report-${TIMESTAMP}.json"

          python - <<'PY'
          from pathlib import Path

          from maref.reporting.exporter import ReportExporter
          from maref.reporting.models import GovernanceReport

          out_dir = Path("docs/verify")
          reports: dict[str, GovernanceReport] = {}
          for f in sorted(out_dir.glob("*.json")):
              try:
                  report = GovernanceReport.from_json(f.read_text("utf-8"))
              except Exception:
                  continue
              reports[report.report_id] = report

          exporter = ReportExporter()
          # 索引行链接的是 <short>.html；只导出 latest.html 会让每一行都 404。
          for report in reports.values():
              exporter.export_report(report, out_dir / f"{report.report_id[:8]}.html")

          newest = max(reports.values(), key=lambda r: r.created_at, default=None)
          if newest is not None:
              exporter.export_report(newest, out_dir / "latest.html")

          exporter.export_index(
              out_dir,
              out_dir / "index.html",
              signer_fingerprint=newest.signer_fingerprint if newest else "",
          )
          PY

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/verify
          publish_branch: gh-pages
          destination_dir: verify
          keep_files: true

      - name: Clean up signing key
        # self-hosted runner 的 _temp 不保证即时清理，私钥不得留在磁盘上
        if: always()
        run: rm -f "$RUNNER_TEMP/maref-report-signing.pem"
