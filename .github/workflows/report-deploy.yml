name: Report Deploy — maref.cc/verify

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

# 仓库默认 GITHUB_TOKEN 为只读；peaceiris/actions-gh-pages 需推送 gh-pages 分支。
permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # maref.crypto 顶层导入 gmssl（identity extra）；audit 报告链路经
          # governance → crypto，缺少该 extra 时导入即失败。
          # maref_lite.cli 顶层导入 demo 命令 → maref.integration.a2a_server，
          # `report generate` 因此需要 sidecar extra 提供的 fastapi/uvicorn。
          pip install -e ".[dev,identity,sidecar]"

      - name: Generate audit log
        run: |
          # AuditLogger 会把相对路径重定向到 MAREF_AUDIT_PATH（默认 .governance/），
          # 而 report generate 的 --audit-log 存在性检查用原始路径；两处必须同用绝对路径。
          python -c "
          from maref.governance.audit import AuditLogger
          from pathlib import Path
          log = AuditLogger(log_path=Path('audit.jsonl').resolve(), hmac_key='ci-key')
          import uuid
          log.log('governance_decision', 'ci-runner', 'auto_report', f'Scheduled report generation {uuid.uuid4().hex[:8]}')
          log.log('verify', 'ci-runner', 'integrity_check', 'All systems nominal')
          "

      - name: Generate GovernanceReport
        env:
          SIGNING_KEY: ${{ secrets.MAREF_REPORT_SIGNING_KEY || '' }}
        run: |
          KEY_ARGS=""
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" > maref-report-signing.pem
            chmod 600 maref-report-signing.pem
            KEY_ARGS="--signing-key maref-report-signing.pem"
            # 下一步的 verify 依赖公钥，此前无任何步骤生成它，该分支从未执行过。
            python -c "
          from maref.signing.signing_key import ReportSigningKey
          ReportSigningKey.from_private_key_file('maref-report-signing.pem').save_public_key('maref-report-signing.pub')
          "
          else
            echo "::warning::MAREF_REPORT_SIGNING_KEY 未配置，本次报告由临时密钥签名，指纹每天变化"
          fi
          python -m maref_lite.cli report generate \
            --audit-log "$PWD/audit.jsonl" \
            $KEY_ARGS \
            --output docs/verify/latest.json

      - name: Verify report
        run: |
          if [ -f "maref-report-signing.pub" ]; then
            python -m maref_lite.cli report verify \
              --file docs/verify/latest.json \
              --pubkey maref-report-signing.pub
          else
            echo "No public key — basic verification only"
            python -m maref_lite.cli report verify --file docs/verify/latest.json
          fi

      - name: Restore published history
        run: |
          # 每次 CI 工作区都是全新的，历史报告只存在于 gh-pages。不取回来的话，
          # 索引每次只含当天的两个 JSON，历史报告会变成没人链接的孤儿文件。
          set -o pipefail
          mkdir -p /tmp/gh-pages-history
          # 必须显式写 refspec：`git fetch origin gh-pages` 只更新 FETCH_HEAD，
          # 不会创建 origin/gh-pages，后面的 git archive 会直接失败。
          if git fetch --depth=1 origin gh-pages:refs/remotes/origin/gh-pages \
             && git archive origin/gh-pages verify | tar -x -C /tmp/gh-pages-history; then
            cp -n /tmp/gh-pages-history/verify/*.json docs/verify/ 2>/dev/null || true
            cp -n /tmp/gh-pages-history/verify/*.html docs/verify/ 2>/dev/null || true
            rm -f docs/verify/index.html
          else
            echo "No gh-pages history yet"
          fi

      - name: Export HTML + index
        run: |
          TIMESTAMP=$(date -u +"%Y%m%dT%H%M%SZ")
          cp docs/verify/latest.json "docs/verify/report-${TIMESTAMP}.json"
          if [ -f maref-report-signing.pub ]; then
            cp maref-report-signing.pub docs/verify/
          fi

          python - <<'PY'
          from pathlib import Path

          from maref.reporting.exporter import ReportExporter
          from maref.reporting.models import GovernanceReport

          out_dir = Path("docs/verify")
          reports: dict[str, GovernanceReport] = {}
          for f in sorted(out_dir.glob("*.json")):
              try:
                  report = GovernanceReport.from_json(f.read_text("utf-8"))
              except Exception:
                  continue
              reports[report.report_id] = report

          exporter = ReportExporter()
          # 索引行链接的是 <short>.html；只导出 latest.html 会让每一行都 404。
          for report in reports.values():
              exporter.export_report(report, out_dir / f"{report.report_id[:8]}.html")

          newest = max(reports.values(), key=lambda r: r.created_at, default=None)
          if newest is not None:
              exporter.export_report(newest, out_dir / "latest.html")

          exporter.export_index(
              out_dir,
              out_dir / "index.html",
              signer_fingerprint=newest.signer_fingerprint if newest else "",
          )
          PY

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/verify
          publish_branch: gh-pages
          destination_dir: verify
          keep_files: true
