# ──────────────────────────────────────────────────────────────────────
# 声称账本门禁 (claim ledger) — 对外数字必须可复算
#
# 与公开仓的 claim_integrity_gate 分工：
#   - claim_integrity_gate：检查 STATE.yaml 的结构性声称（路径/状态/run_id）
#   - claim ledger：执行 claims.yaml 里的命令，验证公开数字（版本/测试/依赖/审计行为）
#
# 本工作流为阻断模式：任何一条声称漂移即 fail。
# ──────────────────────────────────────────────────────────────────────

name: 声称账本

on:
  push:
    branches: [main, develop]
    paths:
      - "claims.yaml"
      - "claims.report.json"
      - "docs/claims.md"
      - "README.md"
      - "pyproject.toml"
      - "src/maref/__init__.py"
      - "scripts/claims.py"
      - "scripts/claims_probe.py"
      - "docs/claims.md"
      - "STATE.yaml"
      - "tests/scripts/test_claims.py"
      - "scripts/interview_ledger.py"
      - "tests/scripts/test_interview_ledger.py"
      - "docs/research/interviews/ledger.yaml"
  pull_request:
    branches: [main, develop]
    paths:
      - "claims.yaml"
      - "README.md"
      - "pyproject.toml"
      - "src/maref/__init__.py"
      - "scripts/claims.py"
      - "scripts/claims_probe.py"
      - "docs/claims.md"
      - "STATE.yaml"
      - "scripts/interview_ledger.py"
      - "tests/scripts/test_interview_ledger.py"
      - "docs/research/interviews/ledger.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install minimal dependencies
        run: pip install pyyaml pytest pytest-cov  # pyproject addopts 含 --cov=src，缺插件会 exit 4

      - name: Verify public claims
        run: python scripts/claims.py --check

      - name: Verify docs/claims.md is in sync
        # docs/claims.md 是"公开声称"的对外页面，必须与 claims.yaml 的实测值一致；
        # 生成器刻意不写时间戳，因此这里可以直接做字节级比较。
        run: python scripts/claims.py --check-docs

      - name: Verify version sites are consistent
        # 版本位点由 scripts/sync_version.py 统一管理（otel / mcp_bridge / gui / uv.lock / STATE）。
        # 2026-11-21：手工改版本漏掉 otel/mcp_bridge，CI 的 otel 测试才抓到——这里提前拦。
        run: python scripts/sync_version.py --check

      - name: Verify audit probes are stdlib-only
        run: python -S scripts/claims_probe.py audit_tamper

      - name: Verify interview ledger structure
        # 市场验证账本也是"对外可引用的事实"：结构不合法（缺 consent / 有 PII /
        # 声称付费但无金额）必须先在这里拦下，而不是等到对外材料里被发现。
        run: python scripts/interview_ledger.py --check

      - name: Regression tests for the ledger itself
        run: |
          pytest tests/scripts/test_claims.py -q --no-cov -p no:cacheprovider
          pytest tests/scripts/test_interview_ledger.py -q --no-cov -p no:cacheprovider
