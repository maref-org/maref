name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify without publishing"
        type: boolean
        default: true
      include_desktop:
        description: "Also build Tauri desktop bundles (out of scope for v0.55.0)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Fail closed before any build: the tagged commit (and the PR that produced
  # it) must have green checks. STATE.yaml booleans are never consulted.
  release-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Verify check-runs for tag and associated PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/release_preflight.py
          --repo "${{ github.repository }}"
          --sha "${{ github.sha }}"

  release-check:
    needs: [release-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,sidecar,otel,a2a,orchestration,identity]"
      - name: Run release check
        run: bash scripts/release-check.sh

  # G7: 发布必须以前置测试为门禁，不允许仅凭版本/打包检查发布
  test-gate:
    needs: [release-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,sidecar,otel,a2a,orchestration,identity]"
      - name: Core test suite (same selection as CI)
        run: >-
          pytest tests/ -x -q --timeout=120 --no-cov
          -m "not integration and not chaos and not benchmark and not slow and not real"
          --ignore=tests/maref/compliance --ignore=tests/desktop --ignore=tests/test_crypto.py

  publish-python:
    needs: [release-preflight, release-check, test-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build package
        run: pip install build && python -m build
      - name: Publish to PyPI
        if: github.event_name == 'push' || github.event.inputs.dry_run != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish-tauri:
    # v0.55.0 is Python-only. Desktop bundles are opt-in via repository
    # variable or explicit workflow_dispatch input; they are not part of the
    # tag release dependency chain.
    needs: publish-python
    if: >-
      (github.event_name == 'push' && vars.RELEASE_INCLUDE_DESKTOP == 'true')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.include_desktop == 'true')
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-latest
            target: ''
            args: ''
          - platform: windows-latest
            target: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        working-directory: ./gui
        run: pnpm install --frozen-lockfile

      - name: Import macOS Certificate
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp build.keychain
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - name: Build Tauri
        working-directory: ./gui
        run: pnpm dlx "@tauri-apps/cli@^2" build ${{ matrix.args }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tauri-${{ matrix.platform }}${{ matrix.args }}
          path: |
            gui/src-tauri/target/release/bundle/**
            gui/src-tauri/target/*/release/bundle/**
