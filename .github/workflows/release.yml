name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify without publishing"
        type: boolean
        default: true
      include_desktop:
        description: "Also build Tauri desktop bundles (out of scope for v0.55.0)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Fail closed before any build: the tagged commit (and the PR that produced
  # it) must have green checks. STATE.yaml booleans are never consulted.
  release-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Verify check-runs for tag and associated PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/release_preflight.py
          --repo "${{ github.repository }}"
          --sha "${{ github.sha }}"

  release-check:
    needs: [release-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,sidecar,otel,a2a,orchestration,identity]"
      - name: Run release check
        run: bash scripts/release-check.sh

  # G7: 发布必须以前置测试为门禁，不允许仅凭版本/打包检查发布
  test-gate:
    needs: [release-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,sidecar,otel,a2a,orchestration,identity]"
      - name: Core test suite (same selection as CI)
        run: >-
          pytest tests/ -x -q --timeout=120 --no-cov
          -m "not integration and not chaos and not benchmark and not slow and not real"
          --ignore=tests/maref/compliance --ignore=tests/desktop --ignore=tests/test_crypto.py

  artifact-gate:
    needs: [release-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build artifacts
        run: pip install build && python -m build --wheel --sdist --outdir dist
      - name: Verify artifact contract
        # 发布前必须验产物本身（[all] 并集 / conformance 是否进 wheel / sdist 是否带宣传视频），
        # 这些属性源码树测试看不见。此前该门只在 ci.yml 上，发布路径无覆盖。
        run: python scripts/verify_artifacts.py --wheel dist/*.whl --sdist dist/*.tar.gz

  publish-python:
    needs: [release-preflight, release-check, test-gate, artifact-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build package
        run: pip install build && python -m build
      # 依赖清单（SBOM）必须随产物一起发布，且必须在 RFC 3161 时间戳之前生成，
      # 这样它也被 SHA256SUMS 与外部时间证明覆盖。
      # 注意：仓库里原有的 sbom.spdx.json 是 2026-07 用开发机环境生成的（5308 个包），
      # 既不可复现也无法对上某一版发布，2026-11-22 起改为每次发布现场生成。
      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      # 外部锚：产物清单的 RFC 3161 时间戳。失败即阻断发布（fail-closed），
      # 因为"何时存在"无法由仓库自身证明，只能由外部 TSA 证明。
      - name: Timestamp artifacts (RFC 3161)
        run: python scripts/rfc3161_stamp.py --files dist/* --out-dir dist
      - name: Stage PyPI distributions
        # 只把 wheel/sdist 交给 PyPI。dist/ 里还有 RFC3161 时间戳产物
        # （SHA256SUMS / .tsq / .tsr / freetsa-cacert.pem），twine 遇到
        # "SHA256SUMS" 会抛 InvalidDistribution 并中断发布（2026-11-21 实测）。
        run: |
          set -euo pipefail
          mkdir -p dist/pypi
          cp dist/*.whl dist/*.tar.gz dist/pypi/
          ls -l dist/pypi
      # 两条互斥路径：仓库变量 PYPI_TRUSTED_PUBLISHING=true 时走 OIDC 可信发布
      # （PEP 740 会为每个文件生成 attestation，PyPI 页面显示 "Attestations"），
      # 否则继续用 API token —— token 路径不会产生 attestation，这是事实。
      # 启用前置条件（PyPI 侧，需人工）：项目 maref → Publishing →
      #   添加 Trusted Publisher（owner maref-org / repo maref / workflow release.yml）。
      - name: Publish to PyPI (trusted publishing + attestations)
        if: vars.PYPI_TRUSTED_PUBLISHING == 'true' && (github.event_name == 'push' || github.event.inputs.dry_run != 'true')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi
      - name: Publish to PyPI (API token, no attestations)
        if: vars.PYPI_TRUSTED_PUBLISHING != 'true' && (github.event_name == 'push' || github.event.inputs.dry_run != 'true')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist/pypi
      - name: Compose release body
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          {
            if [ -f "$notes" ]; then
              cat "$notes"
              echo
            else
              echo "## ${GITHUB_REF_NAME}"
              echo
            fi
            echo "---"
            echo "### 发布证据"
            echo
            echo "- Tag SHA: \`${GITHUB_SHA}\`"
            echo "- Release run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- 采集时间: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- 产物:"
            for f in dist/*; do
              echo "  - \`$(basename "$f")\`"
            done
            echo
            echo "### 外部时间证明（RFC 3161）"
            echo
            echo "本地校验产物完整性: \`sha256sum -c SHA256SUMS\`"
            echo
            echo "第三方校验时间戳（无需信任本仓库）:"
            echo '```'
            echo "openssl ts -verify -in SHA256SUMS.tsr -queryfile SHA256SUMS.tsq \\"
            echo "    -CAfile freetsa-cacert.pem"
            echo '```'
          } > release-body.md
          cat release-body.md

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v3
        with:
          # 显式列出：dist/ 下多了 pypi/ 暂存目录，不能再用 dist/* 兜底
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.tsq
            dist/SHA256SUMS.tsr
            dist/freetsa-cacert.pem
            dist/sbom.spdx.json
          body_path: release-body.md
          generate_release_notes: false

  publish-tauri:
    # v0.55.0 is Python-only. Desktop bundles are opt-in via repository
    # variable or explicit workflow_dispatch input; they are not part of the
    # tag release dependency chain.
    needs: publish-python
    if: >-
      (github.event_name == 'push' && vars.RELEASE_INCLUDE_DESKTOP == 'true')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.include_desktop == 'true')
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-latest
            target: ''
            args: ''
          - platform: windows-latest
            target: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        working-directory: ./gui
        run: pnpm install --frozen-lockfile

      - name: Import macOS Certificate
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp build.keychain
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - name: Build Tauri
        working-directory: ./gui
        run: pnpm dlx "@tauri-apps/cli@^2" build ${{ matrix.args }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tauri-${{ matrix.platform }}${{ matrix.args }}
          path: |
            gui/src-tauri/target/release/bundle/**
            gui/src-tauri/target/*/release/bundle/**
